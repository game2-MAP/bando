<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 한 가지 세계에만 머무는 전시 상황실: 어두운 해도 위에 놋쇠빛 강조. 지도가 화면의 주인공, 오른쪽은 국정 패널 */
:root {
  --bg: #0b1016; --sea: #0e1a26; --panel: #121a23; --panel2: #18222d; --line: #283545;
  --ink: #e6e1d6; --mute: #9aa6b2; --brass: #c8a35a; --danger: #d0563f; --warn: #d1a23d; --ok: #5aa37a;
  --fd: "Noto Serif KR", "Nanum Myeongjo", serif; --fb: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--fb); font-size: 14px; line-height: 1.55; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
[hidden] { display: none !important; }

/* 시작 화면 */
#start { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background:
  radial-gradient(ellipse at 70% 30%, #1a2a3a 0%, transparent 60%), var(--bg); z-index: 30; overflow: auto; }
.startcard { max-width: 620px; display: grid; gap: 18px; }
.startcard small { color: var(--brass); letter-spacing: .18em; font-weight: 600; }
.startcard h1 { font-family: var(--fd); font-weight: 900; font-size: clamp(40px, 7vw, 64px); line-height: 1.1; margin: 0; text-wrap: balance; }
.startcard p { color: #c9c3b6; margin: 0; max-width: 60ch; }
.startcard .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.big { padding: 12px 22px; border-radius: 4px; border: 1px solid var(--brass); background: var(--brass); color: #16110a; font-weight: 600; }
.big.ghost { background: transparent; color: var(--brass); }
.credit { font-size: 12px; color: var(--mute) !important; }

/* 앱 */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
#nation { display: flex; align-items: center; gap: 10px; min-width: 0; }
#nation img { width: 40px; height: 30px; border-radius: 2px; box-shadow: 0 0 0 1px #0006; }
#nation b { font-family: var(--fd); font-size: 18px; display: block; line-height: 1.2; }
#nation small { color: var(--mute); font-size: 12px; }
#date { font-family: var(--fd); font-weight: 700; color: var(--brass); font-size: 16px; white-space: nowrap; }
#stats { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.chip { display: flex; align-items: baseline; gap: 5px; padding: 3px 7px; border-radius: 3px; background: var(--panel2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.chip span { color: var(--mute); font-size: 11.5px; }
.chip b { font-weight: 600; }
.chip.warn { border-color: #6b5420; } .chip.warn b { color: var(--warn); }
.chip.bad { border-color: #6b2a20; } .chip.bad b { color: var(--danger); }
.chip.pp b { color: var(--brass); }
#restart { background: none; border: 1px solid var(--line); border-radius: 3px; padding: 4px 10px; color: var(--mute); font-size: 12px; white-space: nowrap; }
#restart.armed { border-color: var(--danger); color: var(--danger); }

main { display: grid; grid-template-columns: 1fr 400px; min-height: 0; }
#mapwrap { position: relative; min-height: 0; background: var(--sea); overflow: hidden; }
#map { width: 100%; height: 100%; display: block; cursor: grab; }
#map:active { cursor: grabbing; }
.sea { fill: var(--sea); }
.grat { fill: none; stroke: #ffffff0c; stroke-width: .6; }
.prov { stroke: none; transition: fill .5s; }
.prov:hover { filter: brightness(1.18); }
.prov.flash { animation: flash 1.8s ease-out; }
@keyframes flash { 0%, 30% { filter: brightness(2.2) saturate(1.3); } 100% { filter: none; } }
.coast { fill: none; stroke: #0a1218; stroke-linejoin: round; }
.pline { fill: none; stroke: #0005; }
.nborder { fill: none; stroke: #0d1116; stroke-linejoin: round; }
.front { fill: none; stroke: var(--danger); stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 3px #d0563f99); }
.sealink { fill: none; stroke: #8fb3d633; }
.plabels text { fill: #f1ece2; stroke: #0b1016bb; paint-order: stroke; text-anchor: middle; dominant-baseline: middle; font-weight: 600; pointer-events: none; }
.clabels text { fill: #f3efe6; stroke: #0b1016cc; paint-order: stroke; text-anchor: middle; dominant-baseline: middle; font-family: var(--fd); font-weight: 700; pointer-events: none; letter-spacing: .04em; }
.clabels text.me { fill: #fff; }
.um { fill: #e3b33c; fill-opacity: .9; stroke: #1b1206; pointer-events: none; animation: pulse 1.6s ease-in-out infinite; }
.um.hot { fill: #e0512f; }
@keyframes pulse { 50% { fill-opacity: .35; } }
.cap { fill: #ffe6a0; stroke: #2a1d08; stroke-width: 1; paint-order: stroke; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .um, .prov.flash { animation: none; } .prov { transition: none; } }

.modes { position: absolute; top: 12px; left: 12px; display: flex; gap: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: #0b1016dd; }
.modes button, .zoom button { background: none; border: 0; padding: 6px 11px; font-size: 12.5px; color: var(--mute); }
.modes button[aria-pressed="true"] { background: var(--brass); color: #16110a; font-weight: 600; }
.zoom { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 4px; background: #0b1016dd; }
.zoom button + button { border-top: 1px solid var(--line); }
#legend { position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 7px 10px; max-width: calc(100% - 24px); background: #0b1016dd; border: 1px solid var(--line); border-radius: 4px; font-size: 12px; color: #cfc8ba; }
#legend span { display: flex; align-items: center; gap: 5px; }
#legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
#legend i.fr { background: var(--danger); height: 3px; width: 16px; }
#tip { position: absolute; z-index: 5; pointer-events: none; background: #0b1016f2; border: 1px solid var(--line); border-radius: 4px; padding: 8px 11px; min-width: 150px; font-size: 12.5px; }
#tip b { font-family: var(--fd); font-size: 14px; }
#tip .tr { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
#tip img { width: 18px; height: 13px; }
#tip .tm { color: var(--mute); }

aside { display: grid; grid-template-rows: auto 1fr auto; border-left: 1px solid var(--line); background: var(--panel); min-height: 0; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 11px 4px; color: var(--mute); border-bottom: 2px solid transparent; font-weight: 500; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--brass); }
.tabs button.alert::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); margin-left: 6px; vertical-align: 2px; }
#tabbody { overflow-y: auto; padding: 4px 16px 20px; }
#tabbody h3 { font-family: var(--fd); font-size: 15px; margin: 18px 0 8px; color: var(--brass); font-weight: 700; }
.hint { color: var(--mute); font-size: 12.5px; margin: 6px 0 8px; }
.decs { display: grid; gap: 8px; }
.dec { border: 1px solid var(--line); background: var(--panel2); border-radius: 4px; padding: 10px 12px; display: grid; gap: 6px; }
.dec .dh { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.dec .cost { color: var(--brass); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dec p { margin: 0; color: #c2bcb0; font-size: 12.5px; }
.dec button { justify-self: start; padding: 5px 14px; border-radius: 3px; border: 1px solid var(--brass); background: transparent; color: var(--brass); font-size: 12.5px; font-weight: 600; }
.dec button:hover:not(:disabled) { background: var(--brass); color: #16110a; }
.dec button:disabled { border-color: var(--line); color: var(--mute); cursor: not-allowed; font-weight: 400; }
.dec.done { opacity: .55; } .dec.done .cost { color: var(--ok); }
.bar { margin: 8px 0; }
.bl { display: flex; justify-content: space-between; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.bt { position: relative; height: 7px; background: #0b1016; border-radius: 4px; margin-top: 3px; overflow: visible; }
.bt i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--ok); }
.bar.warm .bt i { background: var(--warn); } .bar.hot .bt i { background: var(--danger); }
.bt em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #ffffff55; }
.facbar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; }
.facbar i { display: block; } .fg { background: #8e3b3b; color: #e29a8f; } .fw { background: #3b6a8e; color: #8fbde2; } .fk { background: #4f8e5a; color: #9be2a6; }
.facl { display: flex; justify-content: space-between; font-size: 12px; margin-top: 5px; } .facl span { background: none; }
.regions { display: grid; gap: 4px; }
.reg { display: grid; grid-template-columns: 12px 1fr auto 52px; gap: 8px; align-items: center; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.reg i { width: 12px; height: 12px; border-radius: 2px; } .reg small { color: var(--danger); text-align: right; }
.spirits { display: grid; gap: 6px; }
.sp { border-left: 2px solid var(--brass); padding: 2px 0 2px 10px; } .sp b { font-size: 13px; } .sp p { margin: 2px 0 0; color: var(--mute); font-size: 12px; }
.vs { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.vs > div { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.vs img { width: 26px; height: 19px; }
.vsbar { height: 10px; background: #d2563a; border-radius: 5px; overflow: hidden; } .vsbar i { display: block; height: 100%; background: #3f78c8; }
.stance { display: grid; gap: 6px; }
.stance button { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 9px 12px; display: grid; gap: 2px; }
.stance button span { color: var(--mute); font-size: 12px; }
.stance button.on { border-color: var(--brass); box-shadow: inset 3px 0 0 var(--brass); }
.log { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 8px; }
.log li { font-size: 12.5px; color: #cfc8ba; border-bottom: 1px solid #ffffff0a; padding-bottom: 7px; }
.log time { display: block; color: var(--brass); font-size: 11.5px; }
#next { margin: 10px 14px 14px; padding: 13px; border-radius: 4px; border: 0; background: var(--brass); color: #16110a; font-weight: 700; font-size: 14.5px; }
#next:disabled { background: var(--panel2); color: var(--mute); cursor: default; }

/* 사건 창 */
#modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 18px; background: #05080cc4; }
#modal.peeking { background: transparent; pointer-events: none; }
#modal.peeking #modalcard { display: none; }
#unpeek { position: fixed; z-index: 21; bottom: 18px; left: 50%; transform: translateX(-50%); padding: 10px 22px; border-radius: 20px; border: 1px solid var(--brass); background: var(--panel); color: var(--brass); font-weight: 600; pointer-events: auto; }
#modalcard { width: min(720px, 100%); max-height: calc(100% - 20px); overflow-y: auto; background: #10171f; border: 1px solid var(--line); border-top: 3px solid var(--brass); border-radius: 4px; box-shadow: 0 30px 80px #000a; }
#modalcard header { display: flex; gap: 14px; align-items: center; padding: 18px 22px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #10171f; }
.eflags { display: flex; gap: 4px; } .eflags img { width: 34px; height: 25px; border-radius: 2px; box-shadow: 0 0 0 1px #0007; }
#modalcard header small { color: var(--brass); font-size: 12px; letter-spacing: .06em; }
#modalcard h2 { font-family: var(--fd); font-weight: 900; font-size: 24px; margin: 0; line-height: 1.25; text-wrap: balance; }
.peek { margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 3px; padding: 5px 10px; color: var(--mute); font-size: 12px; white-space: nowrap; }
.etext { padding: 6px 26px 4px; font-family: var(--fd); font-size: 15.5px; line-height: 1.9; color: #e3ddd0; }
.etext p { margin: 12px 0; max-width: 64ch; }
.opts { display: grid; gap: 8px; padding: 12px 22px 22px; }
.opts.row { grid-template-columns: 1fr 1fr; }
.opt { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 11px 14px; display: grid; gap: 3px; }
.opt:hover { border-color: var(--brass); background: #1d2935; }
.opt b { font-weight: 600; } .opt span { color: var(--mute); font-size: 12.5px; }
.opt.main { background: var(--brass); color: #16110a; border-color: var(--brass); }
.ending { padding: 26px 4px 0; }
.ending > small, .ending > h2 { padding: 0 24px; display: block; }
.ending > small { color: var(--brass); letter-spacing: .14em; font-weight: 600; }
.ending h2 { font-size: 34px !important; margin: 4px 0 6px !important; }
.sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 22px 0; }
.sum div { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
.sum dt { color: var(--mute); font-size: 11.5px; } .sum dd { margin: 2px 0 0; font-size: 13px; font-weight: 600; }


.subj { fill: url(#hatch); stroke: none; pointer-events: none; }
#legend i.occ { background: repeating-linear-gradient(45deg, #3f78c8 0 3px, #2a3038 3px 6px); }
#voice { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 140px)); background: #0b1016e8; border: 1px solid var(--line); border-left: 3px solid var(--danger); border-radius: 4px; padding: 9px 14px; font-family: var(--fd); font-size: 14px; line-height: 1.6; color: #efe8da; pointer-events: none; }
#voice b { display: block; font-family: var(--fb); font-size: 11px; color: var(--danger); letter-spacing: .08em; font-weight: 600; }
#voice cite { display: block; font-style: normal; font-family: var(--fb); font-size: 11.5px; color: var(--mute); margin-top: 3px; }
#voice.in { animation: vin .6s ease-out; }
@keyframes vin { from { opacity: 0; transform: translate(-50%, -6px); } }
.epi { margin: 14px 26px 0; padding: 10px 16px; border-left: 2px solid var(--brass); background: #ffffff06; font-family: var(--fd); font-size: 14.5px; line-height: 1.75; color: #d8d1c2; }
.epi cite { display: block; margin-top: 6px; font-style: normal; font-family: var(--fb); font-size: 12px; color: var(--brass); }
.epi cite::before { content: "— "; }
.ending .epi { margin: 12px 22px 4px; }
.parties { display: grid; gap: 4px; }
.parties div { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; font-size: 13px; padding: 3px 6px; border-radius: 3px; }
.parties div.rule { background: #ffffff0a; }
.parties i, .seatl i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
.parties em { font-style: normal; font-size: 11px; color: var(--brass); margin-left: 4px; }
.parties b { font-variant-numeric: tabular-nums; }
.seats { position: relative; display: flex; height: 16px; border-radius: 3px; overflow: hidden; }
.seats u { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: #fff; }
.seatl { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12px; color: var(--mute); }
.seatl span { display: flex; align-items: center; gap: 4px; }
.laws { display: grid; gap: 8px; }
.law { border: 1px solid var(--line); background: var(--panel2); border-radius: 4px; padding: 10px 12px; display: grid; gap: 8px; }
.law .lh { display: flex; justify-content: space-between; gap: 8px; } .law .lh span { color: var(--brass); font-size: 12.5px; }
.lsteps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.lsteps span { font-size: 11px; text-align: center; padding: 4px 2px; border-radius: 2px; background: #0b1016; color: var(--mute); }
.lsteps span.on { background: var(--brass); color: #16110a; font-weight: 600; }
.bill { border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 4px; }
.bill p { margin: 0; font-size: 12.5px; color: #c2bcb0; } .bill small { color: var(--mute); font-size: 12px; }
.bill button { justify-self: start; padding: 5px 12px; border-radius: 3px; border: 1px solid var(--brass); background: transparent; color: var(--brass); font-size: 12.5px; }
.bill button:disabled { border-color: var(--line); color: var(--mute); cursor: not-allowed; }
.doc { margin: 16px 26px 0; font-family: var(--fb); font-size: 14px; }
.doc.wire { border-top: 1px solid var(--line); }
.doc.wire div { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.doc.wire time { color: #d0564a; font-weight: 600; font-variant-numeric: tabular-nums; }
.doc.memo { background: #e9e5dc; color: #23211d; padding: 14px 18px; border-radius: 2px; }
.doc.memo dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px solid #b9b3a6; font-size: 13px; }
.doc.memo dt { color: #6b665c; } .doc.memo dd { margin: 0; font-weight: 600; }
.doc.memo ul { margin: 0; padding-left: 18px; line-height: 1.7; }
.doc.memo p { margin: 10px 0 0; font-size: 12.5px; color: #6b665c; }
.doc.sms { display: grid; gap: 8px; }
.doc.sms div { max-width: 82%; justify-self: start; background: #222a33; padding: 8px 12px; border-radius: 12px 12px 12px 3px; }
.doc.sms div.me { justify-self: end; background: #2f4a63; border-radius: 12px 12px 3px 12px; }
.doc.sms small { display: block; color: #9aa4ad; font-size: 11.5px; margin-bottom: 2px; }
.doc.poll { border: 1px solid var(--line); padding: 12px 14px; border-radius: 3px; display: grid; gap: 7px; }
.doc.poll b { font-size: 13px; color: var(--mute); font-weight: 500; }
.doc.poll div { display: grid; grid-template-columns: 74px 1fr 48px; align-items: center; gap: 8px; }
.doc.poll i { display: block; height: 12px; border-radius: 2px; }
.doc.poll em { font-style: normal; font-variant-numeric: tabular-nums; text-align: right; }
.doc.poll small { color: var(--mute); font-size: 12px; }
.contnote { margin: 4px 26px 0; padding: 8px 12px; border: 1px dashed var(--brass); border-radius: 4px; color: var(--brass); font-size: 13px; }
.chap { padding: 0 22px; }
.voices { display: grid; gap: 8px; }
.voices blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--danger); background: #ffffff05; font-family: var(--fd); font-size: 13.5px; line-height: 1.65; }
.voices span { display: block; font-family: var(--fb); font-size: 11px; color: var(--danger); font-weight: 600; letter-spacing: .06em; }
.voices cite { display: block; font-style: normal; font-family: var(--fb); font-size: 11.5px; color: var(--mute); margin-top: 3px; }
.nats { display: grid; gap: 8px; }
.nat { border: 1px solid var(--line); background: var(--panel2); border-radius: 4px; padding: 9px 11px; display: grid; gap: 7px; }
.nat.war { border-color: #6b2a20; box-shadow: inset 3px 0 0 var(--danger); }
.nh { display: flex; align-items: center; gap: 8px; }
.nh img { width: 24px; height: 18px; border-radius: 2px; }
.nh .pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #0b1016; color: var(--mute); border: 1px solid var(--line); }
.nat.war .pill { color: var(--danger); border-color: #6b2a20; }
.nh .str { margin-left: auto; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
.nbtn { display: flex; flex-wrap: wrap; gap: 6px; }
.nbtn button { padding: 4px 10px; border-radius: 3px; border: 1px solid var(--brass); background: transparent; color: var(--brass); font-size: 12px; }
.nbtn button:hover:not(:disabled) { background: var(--brass); color: #16110a; }
.nbtn button:disabled { border-color: var(--line); color: var(--mute); cursor: not-allowed; }
.subs { display: grid; gap: 6px; }
.sub { display: flex; align-items: center; gap: 8px; font-size: 13px; } .sub img { width: 22px; height: 16px; } .sub span { margin-left: auto; color: var(--mute); font-size: 12px; }

.blocs { display: grid; gap: 8px; }
.bloc { border: 1px solid var(--line); background: var(--panel2); border-radius: 4px; padding: 8px 11px; }
.bloc b { font-size: 13px; } .bloc > span { display: block; color: var(--mute); font-size: 11.5px; }
.bloc ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; font-size: 12.5px; color: var(--mute); }
.bloc li.ok { color: var(--ok); }
.ngroup { margin: 12px 0 6px; font-size: 12px; color: var(--brass); letter-spacing: .06em; font-weight: 600; }
.nat.ally { border-color: #2f5a7a; box-shadow: inset 3px 0 0 #8fc0e8; }
.relbar { position: relative; height: 16px; background: #0b1016; border-radius: 3px; overflow: hidden; }
.relbar::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #ffffff33; }
.relbar i { position: absolute; top: 3px; bottom: 3px; background: var(--ok); border-radius: 2px; }
.relbar span { position: absolute; right: 6px; top: 0; font-size: 11px; line-height: 16px; color: var(--mute); font-variant-numeric: tabular-nums; }
.aiw { display: grid; gap: 6px; } .aiw div { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.aiw img { width: 20px; height: 15px; } .aiw span { margin-left: auto; color: var(--mute); font-size: 11.5px; }
.sf { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font-size: 12.5px; }
.sf div { display: flex; justify-content: space-between; border-bottom: 1px solid #ffffff0a; padding: 2px 0; }
.sf b { font-variant-numeric: tabular-nums; } .sf .pos { color: var(--ok); } .sf .neg { color: var(--danger); }

#ideo { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: baseline; min-width: 170px; padding: 2px 12px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
#ideo small { color: var(--mute); font-size: 11px; }
#ideo b { font-family: var(--fd); font-size: 15px; }
#ideo .iax { grid-column: 1 / -1; position: relative; height: 7px; margin-top: 3px; border-radius: 4px; }
#ideo .ig { position: absolute; inset: 0; border-radius: 4px; background: linear-gradient(90deg, #c0392b, #d98b6a 30%, #9aa6b2 50%, #6f8fb8 70%, #3b3340); }
#ideo em { position: absolute; top: -3px; width: 3px; height: 13px; transform: translateX(-50%); border-radius: 2px; }
#ideo em.cur { background: #fff; box-shadow: 0 0 0 1px #000a; }
#ideo em.tg { background: transparent; border: 1px dashed #ffffffaa; width: 5px; }
#ideo .iaxl { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 9.5px; color: var(--mute); margin-top: 1px; }
#ppanel { position: absolute; right: 12px; bottom: 12px; width: 300px; background: #0b1016f2; border: 1px solid var(--line); border-top: 2px solid var(--brass); border-radius: 4px; padding: 12px 14px; display: grid; gap: 10px; z-index: 4; }
#ppanel .x { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: var(--mute); font-size: 18px; }
#ppanel .ph { display: flex; gap: 10px; align-items: center; }
#ppanel .ph img { width: 30px; height: 22px; border-radius: 2px; }
#ppanel .ph b { font-family: var(--fd); font-size: 16px; display: block; } #ppanel .ph small { color: var(--mute); font-size: 12px; }
#ppanel .pmeter { display: grid; grid-template-columns: 1fr auto; gap: 4px; font-size: 12.5px; } #ppanel .pmeter .bt { grid-column: 1 / -1; }
#ppanel .pacts { display: grid; gap: 6px; }
#ppanel .pacts button { text-align: left; background: var(--panel2); border: 1px solid var(--brass); border-radius: 4px; padding: 7px 10px; display: grid; gap: 2px; }
#ppanel .pacts button:hover:not(:disabled) { background: #2a2416; }
#ppanel .pacts button:disabled { border-color: var(--line); cursor: not-allowed; opacity: .7; }
#ppanel .pacts span { color: var(--mute); font-size: 11.5px; }

/* 메인 메뉴: 상황실 지도 */
#title { position: fixed; inset: 0; z-index: 40; overflow: hidden; background: #0b0d10; color: #e8e4dc; font-family: var(--fb); }
#tbg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tvig { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, #0b0d10f2 0%, #0b0d10d0 34%, #0b0d1000 64%); }
.tinner { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 clamp(24px, 7vw, 110px) 60px; max-width: 640px; }
.tkicker { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #a39d92; }
.tkicker b { background: #b8342a; color: #fff; font-weight: 700; padding: 2px 7px; border-radius: 2px; font-size: 12px; }
.tlogo { margin: 0; font-family: var(--fb); font-weight: 700; font-size: clamp(88px, 13vw, 168px); line-height: 1; letter-spacing: -.05em; color: #efebe3; }
.tlogo::after { content: ""; display: block; width: 1.1em; height: 6px; margin-top: .14em; background: #b8342a; }
.tsub { font-size: 15px; color: #a39d92; }
.tmenu { display: grid; gap: 2px; margin-top: 16px; max-width: 400px; }
.tmenu button { position: relative; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 11px 14px; color: #e8e4dc; display: grid; gap: 2px; border-radius: 0 3px 3px 0; }
.tmenu button b { font-weight: 600; font-size: 19px; }
.tmenu button small { color: #8c877d; font-size: 13px; }
.tmenu button:hover:not(:disabled), .tmenu button:focus-visible { background: #ffffff0d; border-left-color: #b8342a; outline: none; }
.tmenu button:disabled { opacity: .4; cursor: default; }
.tconfirm { max-width: 400px; padding: 14px 16px; border: 1px solid #6b2a20; background: #140d0cee; border-radius: 3px; }
.tconfirm p { margin: 0 0 10px; color: #f0c9b8; }
.tconfirm div { display: flex; gap: 8px; }
.tconfirm button { padding: 8px 16px; border-radius: 3px; border: 1px solid #b8342a; background: #b8342a; color: #fff; font-weight: 600; }
.tconfirm button + button { background: transparent; color: #e8e4dc; border-color: #5a5550; }
.tticker { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; display: flex; align-items: stretch; height: 40px; background: #0b0d10; border-top: 1px solid #262a30; font-size: 14px; overflow: hidden; }
.tticker .ttag { flex: none; display: flex; align-items: center; padding: 0 14px; background: #b8342a; color: #fff; font-weight: 700; }
.tticker .ttrack { flex: 1; overflow: hidden; position: relative; }
.tticker .tline { position: absolute; left: 0; top: 0; height: 100%; display: flex; align-items: center; white-space: nowrap; color: #d6d1c7; animation: tick 70s linear infinite; padding-left: 100%; }
.tticker .tline span::after { content: "|"; color: #5a5550; margin: 0 18px; }
@keyframes tick { to { transform: translateX(-100%); } }
.tver { position: absolute; z-index: 3; right: 16px; top: 14px; font-size: 12px; color: #6f6a62; }
.tpanel { position: absolute; z-index: 4; inset: 0; background: #0b0d10ee; display: grid; place-items: center; padding: 24px; overflow: auto; }
.tpanel .box { width: min(720px, 100%); max-height: 100%; overflow: auto; border-left: 3px solid #b8342a; background: #121519; padding: 22px 24px; border-radius: 0 3px 3px 0; }
.tpanel h2 { font-family: var(--fb); font-weight: 700; margin: 0 0 4px; font-size: 24px; }
.tpanel .egrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin: 14px 0; }
.tpanel .egrid div { border: 1px solid var(--line); border-radius: 3px; padding: 9px 11px; background: #171b20; }
.tpanel .egrid div.lock { opacity: .45; }
.tpanel .egrid small { display: block; color: #c96a5c; font-size: 11.5px; }
.tpanel .egrid b { font-size: 15px; font-weight: 600; }
.tpanel p { color: #c9c3b8; line-height: 1.75; }
.tpanel h3 { font-size: 16px; font-weight: 700; color: #e8e4dc; margin: 22px 0 4px; }
.tpanel .close { margin-top: 6px; padding: 8px 18px; border-radius: 3px; border: 1px solid #5a5550; background: transparent; color: #e8e4dc; }
#prologue { position: fixed; inset: 0; z-index: 45; background: #0b0d10; display: grid; place-items: center; padding: 28px; cursor: pointer; }
#prologue .plines { width: min(620px, 100%); display: grid; gap: 0; border-top: 1px solid #262a30; }
#prologue .plines p { margin: 0; display: grid; grid-template-columns: 92px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid #262a30; font-size: clamp(15px, 1.8vw, 17px); line-height: 1.6; color: #e8e4dc; opacity: 0; transition: opacity .5s; }
#prologue .plines p time { color: #8c877d; font-variant-numeric: tabular-nums; font-size: 14px; padding-top: 2px; }
#prologue .plines p.on { opacity: 1; }
#prologue .plines p.last { color: #fff; font-weight: 600; }
#prologue .plines p.last time { color: #e0614f; }
#prologue > small { position: absolute; bottom: 22px; right: 26px; color: #5f5a52; font-size: 12px; }
@media (prefers-reduced-motion: reduce) { .tticker .tline { animation: none; padding-left: 14px; } #prologue .plines p { transition: none; } }
/* 모바일: 시작 화면 */
@media (max-width: 700px), (max-height: 560px) and (orientation: landscape) {
  #title { overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; -webkit-overflow-scrolling: touch; }
  #tbg, .tvig { position: fixed; }
  .tvig { background: linear-gradient(180deg, #0b0d1000 0%, #0b0d1000 16%, #0b0d10e6 27%, #0b0d10 36%); }
  .tinner { flex: 1 0 auto; height: auto; max-width: none; box-sizing: border-box; justify-content: flex-end; gap: 10px; padding: max(28svh, 160px) 20px 64px; }
  .tlogo { font-size: clamp(68px, 22vw, 104px); }
  .tsub { font-size: 14px; }
  .tmenu { max-width: none; margin-top: 8px; }
  .tmenu button { padding: 12px 12px; }
  .tmenu button b { font-size: 19px; }
  .tconfirm { max-width: none; }
  .tticker { position: fixed; height: calc(40px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); font-size: 13.5px; }
  .tver { display: none; }
  .tpanel { position: fixed; padding: 12px; }
  .tpanel .box { padding: 18px 16px; }
  .tpanel h2 { font-size: 21px; }
  .tpanel .egrid { grid-template-columns: 1fr 1fr; }
  #prologue { padding: 22px 18px; }
  #prologue .plines p { grid-template-columns: 70px 1fr; gap: 10px; font-size: 15px; }
}
/* 모바일: 게임 화면 */
@media (max-width: 900px) {
  body { overflow: auto; font-size: 15px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  #app { height: auto; min-height: 100%; grid-template-columns: minmax(0, 1fr); }
  .top { min-width: 0; }
  .top { gap: 6px 10px; padding: 8px 12px 6px; }
  #nation { order: 1; flex: 1 1 auto; }
  #nation img { width: 32px; height: 24px; }
  #nation b { font-size: 16px; }
  #nation small { font-size: 11.5px; }
  #date { order: 2; font-size: 15px; }
  #restart { order: 3; padding: 6px 10px; }
  #ideo { order: 4; flex: 1 1 100%; min-width: 0; padding: 4px 0 2px; border: 0; border-top: 1px solid var(--line); }
  html, body { overflow-x: hidden; max-width: 100%; }
  main > *, aside, #tabbody { min-width: 0; }
  #stats { order: 5; flex: 1 1 100%; min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin: 0; }
  .chip { justify-content: space-between; padding: 5px 8px; min-width: 0; }
  .chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip span { font-size: 12px; }
  main { grid-template-columns: 1fr; }
  #mapwrap { height: 54svh; min-height: 300px; }
  .modes { top: 8px; left: 8px; }
  .zoom { top: 8px; right: 8px; }
  .modes button, .zoom button { padding: 9px 13px; font-size: 13.5px; }
  #legend { left: 8px; bottom: 8px; font-size: 11.5px; padding: 6px 8px; max-width: calc(100% - 16px); }
  #tip { display: none; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .tabs { position: sticky; top: 0; z-index: 6; background: var(--panel); }
  .tabs button { padding: 14px 4px; font-size: 14.5px; }
  #tabbody { max-height: none; padding: 4px 14px 32px; }
  #next { position: sticky; bottom: 0; z-index: 7; margin: 0; border-radius: 0; padding: 15px 14px calc(15px + env(safe-area-inset-bottom)); font-size: 15.5px; box-shadow: 0 -8px 24px #000a; }
  #tabbody h3 { font-size: 16px; }
  .hint { font-size: 13.5px; line-height: 1.6; }
  .dec { padding: 12px 13px; }
  .dec p { font-size: 13.5px; line-height: 1.6; }
  .dec button { padding: 9px 20px; font-size: 14px; }
  .bl, .facl, .reg, .sf { font-size: 13.5px; }
  #ppanel { position: fixed; left: 0; right: 0; bottom: 0; width: auto; max-height: 72svh; overflow-y: auto; border-radius: 12px 12px 0 0; border-left: 0; border-right: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); z-index: 15; box-shadow: 0 -12px 40px #000c; }
  #ppanel .x { font-size: 24px; top: 8px; right: 12px; }
  #ppanel .pacts button { padding: 11px 12px; }
  #ppanel .pacts span { font-size: 12.5px; }
  #modal { padding: 0; place-items: stretch; }
  #modalcard { width: 100%; max-height: none; height: 100%; border-radius: 0; border-left: 0; border-right: 0; -webkit-overflow-scrolling: touch; }
  #modalcard header { padding: 12px 16px 10px; gap: 10px; }
  #modalcard h2 { font-size: 21px; }
  .peek { padding: 7px 10px; }
  .epi { margin: 12px 16px 0; padding: 10px 14px; font-size: 14.5px; }
  .etext { padding: 4px 18px; font-size: 16px; line-height: 1.85; }
  .etext p { margin: 14px 0; }
  .opts { padding: 10px 14px calc(22px + env(safe-area-inset-bottom)); gap: 10px; }
  .opts.row { grid-template-columns: 1fr; }
  .opt { padding: 13px 14px; }
  .opt b { font-size: 15.5px; line-height: 1.45; }
  .opt span { font-size: 13.5px; line-height: 1.55; }
  .sum { grid-template-columns: 1fr 1fr; margin: 8px 14px 0; }
  .ending > small, .ending > h2 { padding: 0 16px; }
  .ending .epi { margin: 12px 16px 4px; }
  .doc { margin: 14px 16px 0; }
}

<section id="title" hidden>
  <canvas id="tbg" aria-hidden="true"></canvas>
  <div class="tvig" aria-hidden="true"></div>
  <div class="tinner">
    <div class="tkicker"><b>상황</b><span>대한민국, 2020년부터 2060년까지</span></div>
    <h1 class="tlogo">반도</h1>
    <nav class="tmenu" aria-label="메인 메뉴">
      <button id="tcont" type="button"><b>이어하기</b><small id="tcontinfo"></small></button>
      <button id="tnew" type="button"><b>새 게임</b><small>2020년 1월, 첫 확진자가 나온 주부터</small></button>
      <button id="tends" type="button"><b>엔딩 기록</b><small id="tendsinfo"></small></button>
      <button id="tcred" type="button"><b>제작 정보</b><small>세계관, 출처</small></button>
    </nav>
    <div class="tconfirm" id="tconfirm" hidden><p>진행 중인 판이 사라집니다. 새로 시작할까요?</p><div><button id="tyes" type="button">새로 시작</button><button id="tno" type="button">돌아가기</button></div></div>
  </div>
  <div class="tticker" aria-label="뉴스 자막"><span class="ttag">속보</span><div class="ttrack"><div class="tline" id="tline"></div></div></div>
  <div class="tver">6판</div>
  <div class="tpanel" id="tpanel" hidden></div>
</section>
<section id="prologue" hidden><div class="plines" id="plines"></div><small>눌러서 건너뛰기</small></section>

<div id="app" hidden>
  <header class="top">
    <div id="nation"></div>
    <div id="ideo"></div>
    <div id="date"></div>
    <div id="stats"></div>
    <button id="restart" type="button">메인 메뉴</button>
  </header>
  <main>
    <section id="mapwrap">
      <svg id="map" role="img" aria-label="동아시아 정치 지도"></svg>
      <div class="modes" role="group" aria-label="지도 보기 방식">
        <button data-m="pol" aria-pressed="true" type="button">정치</button>
        <button data-m="bloc" aria-pressed="false" type="button">진영</button>
        <button data-m="unrest" aria-pressed="false" type="button">소요</button>
      </div>
      <div class="zoom"><button id="zin" type="button" aria-label="확대">＋</button><button id="zout" type="button" aria-label="축소">－</button><button id="zkor" type="button">반도</button><button id="zall" type="button">전체</button></div>
      <div id="legend"></div>
      <div id="voice" hidden></div>
      <div id="tip" hidden></div>
      <div id="ppanel" hidden></div>
    </section>
    <aside>
      <nav class="tabs" role="tablist">
        <button data-t="gov" role="tab" type="button">국정</button>
        <button data-t="soc" role="tab" type="button">사회</button>
        <button data-t="war" role="tab" type="button">전쟁·외교</button>
        <button data-t="pol" role="tab" type="button">정치</button>
        <button data-t="log" role="tab" type="button">지난 사건</button>
      </nav>
      <div id="tabbody"></div>
      <button id="next" type="button">다음 분기로</button>
    </aside>
  </main>
</div>
<div id="modal" hidden><div id="modalcard"></div></div>
<button id="unpeek" type="button" hidden>사건으로 돌아가기</button>

function coreOf(E) { return PMETA.filter(p => p.c === E).map(p => p.id); }
function natStr(E) {
  const N = NAT[E]; if (!N) return 0;
  let b = N.base;
  if (E === 'CHN') { if (S.flags.chinaStrong) b *= 1.1; if (S.flags.chinaWeak) b *= 0.82; if (S.flags.cnCrisis) b *= 0.75; if (S.flags.cnPurge) b *= 0.8; b *= 1 + 0.006 * S.turn; }
  if (E === 'RUS' && S.flags.rusWeak) b *= 0.5;
  if (E === 'IND') b *= 1 + 0.006 * S.turn;
  if (E === 'PRK' && S.flags.chinaArms) b *= 1.15;
  if (E === 'JPN') { if (S.flags.jpRearm) b *= 1.25; b *= 1 + 0.002 * S.turn; }
  // 안보 딜레마: 한국이 군비를 늘리면 주변 강대국도 맞춰 늘린다
  if (GREAT.includes(E)) b *= 1 + clamp((S.st.mil - 120) / 400, 0, 0.45);
  const core = coreOf(E), held = core.filter(id => S.own[id] === E).length;
  const frac = core.length ? held / core.length : 0;
  let s = b * Math.pow(frac, 0.8);
  if (S.war && S.war.enemies.includes(E)) {
    // 대국은 시간이 지나며 병력을 끌어온다
    const mob = (E === 'PRK' || E === 'MNG' || !GREAT.includes(E)) ? 1 : clamp(0.78 + S.war.turns * 0.04, 0.78, 1);
    s *= mob * (1 - Math.min(0.35, (S.war.exh[E] || 0) / 100));
    if (E === 'CHN' && S.war.cnLimited) s *= 0.4;
  }
  return s;
}
function joinedAllies() {
  if (!S.war) return [];
  const en = S.war.enemies, res = [];
  if (S.spirits.includes('pdto') && !en.includes('JPN') && owned('JPN').length && en.some(x => ['CHN', 'PRK', 'RUS'].includes(x))) res.push('JPN');
  if (S.align === 'china' && !en.includes('CHN') && owned('CHN').length) res.push('CHN');
  if (S.align === 'russia' && !en.includes('RUS') && owned('RUS').length) res.push('RUS');
  for (const a in S.allies) {
    if (!S.allies[a] || en.includes(a) || !owned(a).length || res.includes(a)) continue;
    if (S.war.defensive || en.some(x => ['CHN', 'RUS', 'PRK'].includes(x)) || touches(a, en)) res.push(a);
  }
  return res;
}
const allyNames = joinedAllies;
function touches(a, list) { return Object.keys(S.own).some(id => S.own[id] === a && (ADJ[id] || []).some(j => list.includes(S.own[j]))); }
function allyPower(a) {
  const en = S.war ? S.war.enemies : [];
  if (a === 'JPN') return (en.every(x => x === 'PRK') ? 20 : 30) * (S.flags.pdtoQuiet ? 0.7 : 1);
  if (a === 'CHN' || a === 'RUS') return natStr(a) * 0.25;
  return natStr(a) * (touches(a, en) ? 0.3 : 0.12);
}
function warPower() {
  let p = S.st.mil * (0.6 + S.st.ws / 110) * (1 + S.st.tech * 0.08);
  const en = S.war ? S.war.enemies : ['PRK'];
  const peninsula = en.every(e => e === 'PRK' || e === 'CHN');
  if (S.usfk === 'pact' && peninsula) p *= 1.2;
  if (S.flags.pdtoLanding) p *= 1.3;
  if (S.cabinet === 'military' || S.route === 'junta') p *= 1.12; else if (S.cabinet === 'grand') p *= 1.06;
  if (S.war && S.war.stance === 'mob') p *= 1.15;
  if (S.war && S.war.bonusP > 0) p *= 1.2;
  p /= 1 + occIds().length * 0.02; // 점령지 수비에 묶이는 병력
  joinedAllies().forEach(a => p += allyPower(a));
  p += Object.keys(S.subj).length * 6;
  return p;
}
function enemyPower() { if (!S.war) return 0; let e = S.war.enemies.reduce((a, t) => a + natStr(t), 0) + covertBonus(); if (S.war.bonusE > 0) e *= 1.25; if (S.st.nuke >= 2) e *= 0.9; return e; }
function startWar(enemies, opt = {}) {

  if (S.own[id] !== 'KOR') return { ok: false, why: '우리 영토가 아닙니다' };
  if (!a.ok(id)) return { ok: false, why: '소요가 크지 않습니다' };
  if (S.locCd[id]) return { ok: false, why: `${S.locCd[id]}분기 후 가능` };
  if (S.st.pp < a.cost) return { ok: false, why: '정치력 부족' };
  return { ok: true };
}
function doLocal(id, k) {
  const st = localState(id, k); if (!st.ok || S.ended || S.queue.length) return;
  S.st.pp -= LOCAL[k].cost; LOCAL[k].fx(id); S.locCd[id] = 2;
  L(`${PNAME[id]} — ${LOCAL[k].n}`);
  save(); render();
}

// ================= 저장 =================
const SAVE_KEY = 'bulgil-peninsula-v3';
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { } }
function load() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

strait: {
  title: '해협의 불꽃', tags: ['CHN', 'TWN'], when: s => s.turn >= 10,
  text: `합참의장 강태준은 지도를 펴지도 않고 말했다. 이미 머릿속에 다 들어 있는 사람 같았다.

"대만 넘어가면 다음 압박은 서해로 옵니다. 그건 확실해요. 근데 지금 우리 배를 내려보내면 평양이 가만있겠습니까."

"그래서요?"

"배는 두고, 탄약하고 정보만 보내자는 겁니다. 그걸로 대만이 버티냐고 물으시면… 저도 모르겠습니다."

외교안보수석이 테이블 끝에서 손을 들었다. "베이징은 이번에 누가 대만 편에 섰는지 다 기억할 거예요. 이기든 지든요. 가만히 있으면 적어도 그 명단엔 안 올라갑니다."

"대신 우리 차례가 왔을 때 우리 편 들어 줄 명단에서도 빠지겠죠." 강태준이 받았다.

아무도 대꾸하지 않았다.`,

  opts: [
    { t: '중립을 지킵니다', h: '중국과의 관계 유지 · 대만 함락 가능성 높음', fx: () => { S.taiwan = 'none'; } },
    { t: '탄약과 정보를 지원합니다', h: '대만 함락 가능성 감소 · 중국 반감', fx: () => { S.taiwan = 'rear'; A('rep', 4); S.flags.chinaAngry = true; } },

  ] },

straitend: {
  title: '해협의 결말', tags: ['CHN', 'TWN'], when: s => s.turn >= 12 && s.done.strait,
  text: () => S.flags.taiwanFell
    ? `봉쇄는 넉 달을 버티지 못했다. 타이베이 총통부 앞에 오성홍기가 올라가는 장면이 전 세계에 생중계됐다. 대만해협은 더 이상 해협이 아니라 중국의 내해가 되었다.

강태준은 화면을 끄고 오래 앉아 있었다. "이제 베이징은 손이 비었습니다. 그리고 그 손이 다음에 어디로 갈지는 지도를 보면 압니다. 평양은 오늘 밤 잠을 못 잘 거예요. 너무 기뻐서요."`
    : `상륙은 실패했다. 해협을 건너던 함정들 중 상당수가 돌아오지 못했고, 베이징은 공식 발표에서 그 숫자를 끝내 밝히지 않았다. 중국 내부에서는 처음으로 군 지도부를 향한 불만이 공개적으로 터져 나왔다.

강태준은 보고서를 넘기며 말했다. "중국이 다친 건 확실합니다. 다만 다친 짐승이 더 위험하다는 말도 있지요. 당분간 베이징은 한반도까지 손을 뻗을 여유가 없을 겁니다. 그 당분간이 얼마나 갈지는 아무도 모릅니다."`,
  opts: [{ t: '계속', h: '', fx: () => { } }],
  pre: () => {
    let ch = 0.6 - (S.taiwan === 'mediate' ? 0.05 : 0) - (S.taiwan === 'rear' ? 0.15 : 0) - (S.taiwan === 'navy' ? 0.28 : 0) - (S.usfk === 'pdto' ? 0.1 : 0) + (S.flags.finland ? 0.05 : 0);
    S.flags.taiwanFell = Math.random() < ch;
    if (S.flags.taiwanFell) { setOwn(['TWN'], 'CHN'); S.flags.chinaStrong = true; L('대만이 중국에 병합됐다.'); }
    else { S.flags.chinaWeak = true; L('중국의 대만 상륙 작전이 실패했다.'); }
  } },

mediation: {
  title: '베이징의 중재', tags: ['CHN', 'PRK', 'KOR'], when: s => s.turn >= 13 && s.flags.finland && s.usfk === 'beijing' && !s.outcome && !s.war && !s.done.dandong,
  text: `평양의 공격 징후가 잡히자 서울은 밀약 각서를 꺼내 들었다. 왕쉬안은 이틀 뒤에 다시 왔다. 이번에는 조건이 하나 더 붙어 있었다.

"평양은 우리가 멈추겠습니다. 이미 단둥의 송유관 밸브를 잠갔어요. 다만 그 대가로 서울도 한 가지를 해줘야 합니다. 남북 동시 군축, 그리고 앞으로 한반도 어느 쪽에도 외국 군대를 두지 않는다는 공동 선언. 한국은 강해지는 걸 포기하는 대신 안전해지는 겁니다. 나쁜 거래는 아니라고 생각합니다."

국방부 회의실에서는 고성이 오갔다. 젊은 영관 장교 하나가 회의가 끝난 뒤 복도에서 혼잣말처럼 중얼거렸다. "우리가 지키는 게 나라인지, 베이징이 허락한 울타리인지 모르겠네."`,
  opts: [
    { t: '중재를 받아들입니다', h: '전쟁 회피 · 군 소장파 +15 · 군사력 −10 · 훗날 영세중립 선언 가능', fx: () => { S.flags.noWar = true; S.outcome = 'none'; G({ junior: 15 }); A('mil', -10); A('stab', 4); L('남북 동시 군축 선언이 발표됐다.'); } },
    { t: '각서를 찢습니다', h: '밀약 파기 · 전쟁 대비로 전환', fx: () => { S.flags.finland = false; unsp('finland'); S.flags.medRejected = true; S.flags.chinaAngry = true; Q('dandong'); } },
    { t: '조건을 다시 협상합니다', h: '전쟁 회피 · 정치력 −40 · 군사력 −5 · 군 소장파 +8', fx: () => { S.flags.noWar = true; S.outcome = 'none'; A('pp', -40); A('mil', -5); G({ junior: 8 }); A('stab', 3); } },
  ] },

dandong: {
  title: '단둥의 찻집', tags: ['KOR', 'PRK'], when: s => s.turn >= 13 && !s.flags.finland && !s.flags.noWar,
  text: `국정원 보고는 짧았다. 휴전선 일대에 북한 포병이 전진 배치되고 있다. 시간이 별로 없다.

단둥 강변 찻집 유리창에 압록강 건너편 불빛이 번져 있었다. 맞은편 사내는 차에 손도 대지 않았다. 군복은 아니었는데, 앉은 자세만 봐도 어디서 온 사람인지 티가 났다.

"뭐가 궁금한지 압니다." 사내가 먼저 말했다. "총참모부 안에 원수님 말 듣기 싫은 사람이 있냐. 있습니다."

"몇 명이나요?"

"그건 말 못 하고." 사내가 의자에 등을 기댔다. "착각은 하지 마시오. 그 사람들, 서울이 좋아서 이러는 거 아니니까. 베이징이 우리 땅을 전쟁터로 쓰고, 끝나면 특별행정구 같은 걸로 만들까 봐 그러는 거요. 남조선한테 먹히려는 게 아니라 아무한테도 안 먹히려는 거지."

요원 서진하는 잔을 내려놓았다. "그거면 돼요. 저희도 평양에 태극기 꽂자는 거 아닙니다. 하나만 부탁할게요. 일이 터지면 휴전선 쪽 포병만 움직이지 않게 해 주세요."

"그다음은?"

"그다음은 그다음에 얘기하죠. 당신들이 무슨 나라를 세우든, 저희가 제일 먼저 인정할게요."

사내는 대답 대신 처음으로 찻잔을 들었다.

서울로 올라간 보고서는 한 장이었다. 먼저 칠 것인가, 기다릴 것인가, 이 사내를 믿을 것인가.`,
  opts: [
    { t: '먼저 칩니다 — 선제타격', h: '초반 공세 크게 유리 · 평판 −15 · 중국이 곧바로 개입할 수 있습니다', fx: () => { S.flags.plan = 'pre'; } },
    { t: '기다립니다 — 방어 태세', h: '명분 유지 · 수도권이 첫 타격을 받습니다', fx: () => { S.flags.plan = 'wait'; } },
    { t: '평양 안쪽을 건드립니다', h: () => `성공하면 북한이 쪼개집니다 · 실패하면 남침이 더 세게 온다 (성공 가능성 ${Math.round(coupChance() * 100)}%)`, fx: () => { S.flags.plan = 'coup'; S.flags.coupOK = Math.random() < coupChance(); } },
    { t: '동맹과 함께 무력 시위를 벌입니다', h: '주한미군이나 PDTO가 있을 때 · 절반의 확률로 전쟁을 막습니다 · 막지 못하면 초반 열세 없이 맞섭니다', if: () => S.usfk === 'pact' || S.spirits.includes('pdto'), fx: () => { S.flags.plan = 'deter'; S.flags.deterOK = Math.random() < 0.5; A('rep', 3); } },
  ] },

killchain: {
  title: '킬체인', tags: ['KOR', 'PRK'], when: s => s.turn >= 14 && s.flags.plan === 'pre',
  text: `새벽 세 시 사십 분, 충청과 강원의 산속 발사대에서 미사일이 동시에 솟아올랐다. 첫 목표는 휴전선 북쪽의 장사정포 진지, 두 번째 목표는 평양 외곽의 지휘 시설이었다.

합참 지하 벙커에서 강태준은 화면 속 섬광이 하나씩 꺼지는 걸 지켜봤다. "1차 타격 결과 좋습니다. 북쪽 포병 상당수가 침묵했어요. 이제부터가 문제입니다. 세상은 오늘 아침 누가 먼저 쐈는지만 기억할 겁니다. 그리고 베이징은 그걸 핑계로 삼겠지요. 우리는 최대한 빨리, 최대한 멀리 가야 합니다. 저쪽이 정신을 차리기 전에요."`,
  opts: [{ t: '진격하라', h: '전쟁 시작 · 첫 두 분기 공세 보너스 · 평판 −15', fx: () => { startWar(['PRK'], { stance: 'off', bonusP: 2 }); A('rep', -15); A('ws', 10); S.flags.preStrike = true; } }] },

firesea: {
  title: '불바다의 아침', tags: ['PRK', 'KOR'], when: s => s.turn >= 14 && (s.flags.plan === 'wait' || (s.flags.plan === 'deter' && !s.flags.deterOK)),
  text: `포성은 일요일 아침에 시작됐다. 파주와 연천의 들판이 먼저 불탔고, 곧 서울 북부의 아파트 단지 위로 연기가 올라갔다. 사람들은 칠십여 년 전 할아버지들이 그랬던 것처럼 남쪽으로 가는 길을 메웠다.

강태준은 상황판 앞에서 무전기를 내려놓지 못했다. "1군단 방어선은 아직 버티고 있습니다. 다만 저쪽이 생각보다 훨씬 준비를 많이 했어요. 우리가 먼저 치지 않은 덕분에 오늘 세계는 우리 편입니다. 그건 확실해요. 문제는 세계의 동정이 포탄을 막아주지는 않는다는 겁니다."`,
  opts: [{ t: '방어선을 지켜라', h: '전쟁 시작 · 첫 두 분기 적 공세 보너스 · 평판 +10 · 전쟁 지지 +18', fx: () => { startWar(['PRK'], { stance: 'def', bonusE: S.flags.plan === 'deter' ? 0 : 2, defensive: true }); A('rep', 10); A('ws', 18); A('stab', -8); } }] },

coupok: {
  title: '평양의 총성', tags: ['PYG', 'HAM', 'SAR'], when: s => s.turn >= 14 && s.flags.plan === 'coup' && s.flags.coupOK,
  text: `남침 예정일 이틀 전, 평양 중심부에서 총성이 울렸다. 총참모부 일부 부대가 지휘부를 장악했고, 조선중앙텔레비전은 하루 종일 같은 클래식 음악만 내보냈다. 그다음 날 화면에 나온 사람은 원수가 아니었다. 평양 과도군사위원회 위원장 리광천이라는 이름이었다.

하지만 쿠데타는 북한 전체를 쥐지 못했다. 함흥과 청진의 군단은 평양의 새 정권을 인정하지 않았고, 신의주 일대에는 하룻밤 사이에 중국군이 들어와 '질서 유지'를 선언했다.

서진하는 단둥에서 받은 짧은 전문을 대통령에게 내밀었다. "약속은 지켜졌습니다. 휴전선의 포는 한 발도 쏘지 않았어요. 이제 문제는 북쪽이 셋으로 쪼개졌다는 겁니다. 리광천 쪽은 우리 도움을 원하고, 함경 쪽 군벌은 누구도 믿지 않고, 신의주에는 베이징이 깃발을 꽂았습니다. 우리가 손을 넣으면 평양을 얻을 수 있을지도 몰라요. 대신 그 순간부터 북쪽의 모든 총구가 우리를 향할 수도 있습니다."`,
  pre: () => {
    setOwn(['PRK_PN', 'PRK_HH', 'PRK_GW'], 'PYG'); setOwn(['PRK_HN', 'PRK_HB', 'PRK_YG'], 'HAM'); setOwn(['PRK_PB', 'PRK_JG'], 'SAR');
    S.flags.coupTurn = S.turn; L('평양에서 쿠데타. 북한이 셋으로 갈라졌다.');

  opts: [
    { t: '평양 과도위를 지원합니다', h: '평양 과도위 강화 · 매 분기 지원 · 훗날 두 조선 연합 협상', fx: () => { S.flags.backPYG = true; S.flags.warlords = true; S.outcome = 'warlords'; A('rep', 6); A('econ', -2); } },
    { t: '국경만 지키고 지켜봅니다', h: '군벌끼리 싸웁니다 · 피난민 유입 · 중국 괴뢰가 커질 수 있습니다', fx: () => { S.flags.warlords = true; S.outcome = 'warlords'; } },
    { t: '베이징과 북쪽을 나눕니다', h: '청천강 이남 확보 · 이북은 중국 영향권 · 대학 불만 +10 · 평판 −8', fx: () => { ['PRK_PN', 'PRK_HH', 'PRK_GW', 'PRK_HN'].forEach(id => capture(id, 'KOR')); setOwn(['PRK_PB', 'PRK_JG', 'PRK_YG', 'PRK_HB'], 'SAR'); S.outcome = 'split'; S.flags.warEnd = S.turn; G({ univ: 10, relig: 4 }); A('rep', -8); L('청천강선을 경계로 한반도 북부가 분할됐다.'); } },
  ] },

coupfail: {
  title: '끊어진 선', tags: ['PRK', 'KOR'], when: s => s.turn >= 14 && s.flags.plan === 'coup' && !s.flags.coupOK,
  text: `단둥에서 오기로 한 연락은 오지 않았다. 대신 조선중앙통신이 '남조선 괴뢰 정보원과 결탁한 반당 종파 분자'들의 처형 소식을 전했다. 이름 목록 맨 위에는 서진하가 찻집에서 마주 앉았던 사내의 이름이 있었다.

그리고 그날 밤 포성이 시작됐다. 평양은 서울이 무슨 짓을 하려 했는지 알고 있었고, 그래서 계획보다 일주일 먼저, 계획보다 더 세게 들이쳤다.

서진하는 보고를 마치고도 자리를 뜨지 못했다. "제 판단이 틀렸습니다. 그 사람은 진짜였어요. 진짜였기 때문에 들킨 겁니다. 이제 저쪽은 우리가 내부를 흔들 수 있다는 걸 알았으니 더 독해질 거예요. 변명하지 않겠습니다. 다만 그 사람이 왜 죽었는지는 기억해 주셨으면 합니다."`,
  opts: [{ t: '방어선을 지켜라', h: '전쟁 시작 · 첫 세 분기 적 공세 보너스', fx: () => { startWar(['PRK'], { stance: 'def', bonusE: 3, defensive: true }); A('ws', 14); A('stab', -10); } }] },

winter: {
  title: '비상의 겨울', tags: ['KOR'], when: s => !s.cabinet && ((s.war && s.war.peninsula && s.war.turns >= 2) || (s.flags.coupTurn != null && s.turn >= s.flags.coupTurn + 1)),
  text: `국회 본회의장의 의석 절반이 비어 있었다. 의원 몇은 지역구 피난민 대책 때문에 내려갔고, 몇은 그냥 오지 않았다. 대통령은 그날 저녁 야당 원내대표 정태헌과 합참의장 강태준을 함께 불렀다.

정태헌은 앉자마자 본론부터 꺼냈다. "저는 지금 이 정부를 비판할 생각이 없습니다. 비판은 전쟁이 끝난 다음에 해도 늦지 않아요. 제가 드리고 싶은 제안은 하나입니다. 거국내각을 만들죠. 여야가 장관 자리를 나눠 맡고, 전쟁이 끝날 때까지 정쟁은 멈추는 겁니다. 그래야 국민들한테 이 나라가 아직 하나라는 걸 보여줄 수 있습니다."

강태준은 그 말을 듣고도 고개를 끄덕이지 않았다. "원내대표님 말씀이 틀린 건 아닙니다. 다만 지금 전선에서 필요한 건 회의가 아니라 속도예요. 공장 가동, 철도 징발, 언론 보도 통제까지 매번 국회 동의를 받다가는 결정이 내려질 때쯤이면 이미 늦습니다. 저는 정권을 원하는 게 아닙니다. 전쟁이 끝날 때까지만, 군에 비상 권한을 주십시오."

대통령은 두 사람 사이에서 오래 침묵했다. 어느 쪽을 택하든 그 결정은 전쟁보다 오래 남을 것이었다.`,
  opts: [
    { t: '국회 기능을 그대로 유지합니다', h: '정통성 유지 · 효율 보너스 없음', fx: () => { S.cabinet = 'assembly'; A('rep', 4); L('정부는 전시에도 국회 기능을 유지하기로 했다.'); } },
    { t: '거국내각을 구성합니다', h: '전시 군사력 ×1.07 · 반발 완화 · 매 분기 정치력 소모', fx: () => { S.cabinet = 'grand'; sp('grand'); A('stab', 6); L('여야 연립 전시 거국내각이 출범했다. 총리는 정태헌.'); } },
    { t: '군에 비상 권한을 맡깁니다', h: '전시 군사력 ×1.15 · 군 소장파·대학 불만 상승', fx: () => { S.cabinet = 'military'; sp('martial'); A('rep', -8); G({ univ: 8 }); L('계엄이 선포됐다. 계엄사령관은 강태준.'); } },
  ] },

china: {
  title: '압록강의 그림자', tags: ['CHN', 'PRK'],
  text: `압록강 철교 위로 끝없는 차량 행렬이 넘어왔다. 베이징은 '조선 인민의 요청에 따른 지원'이라고 발표했지만, 위성 사진 속의 장비는 지원이라기보다 하나의 군대였다.

강태준은 화면 앞에서 목소리를 낮췄다. "역사책을 다시 펼치는 기분입니다. 칠십 년 전에도 이 강을 넘어온 사람들 때문에 우리는 다 잡은 통일을 놓쳤어요. 이번에는 그때와 다르게 끝나야 합니다. 다만 솔직히 말씀드리면, 지금 우리 힘만으로 저 행렬을 다시 강 건너로 밀어낼 수 있을지는 모르겠습니다."`,
  pre: () => {
    addEnemy('CHN'); S.war.cnLimited = true;
    const back = ['PRK_PB', 'PRK_JG', 'PRK_YG', 'PRK_HB'].filter(owns).slice(0, 2);
    if (back.length) setOwn(back, owned('PRK').length ? 'PRK' : 'CHN');
    L('중국 인민해방군이 압록강을 건넜다.');
  },
  opts: [{ t: '버텨라', h: '중국이 제한전으로 참전 · 중국 본토를 공격하면 전면전이 됩니다', fx: () => { A('ws', 6); } }] },

chinawarn: {
  title: '베이징의 경고', tags: ['CHN', 'KOR'],
  text: `왕쉬안은 이번엔 찻집에 오지 않았다. 대신 짧은 전문 한 장이 왔다.

"각서는 평양이 먼저 움직이면 우리가 그를 멈춘다는 약속이었지, 서울이 압록강까지 올라와도 된다는 약속이 아니었습니다. 지금 멈추면, 우리는 각서를 계속 지키겠습니다. 멈추지 않으면 각서는 그날로 종이에 불과해집니다."`,
  opts: [
    { t: '진격을 멈추고 휴전합니다', h: '현재 전선에서 휴전', fx: () => { endWar(classify()); } },
    { t: '각서를 무시하고 진격합니다', h: '밀약 파기 · 중국 개입', fx: () => { S.flags.finland = false; unsp('finland'); A('rep', -6); S.flags.chinaAngry = true; S.done.china = false; Q('china'); } },
  ] },

seoul: {
  title: '한강의 다리', tags: ['KOR', 'PRK'],
  text: `서울이 무너졌다. 마지막 부대가 한강 다리를 건넌 뒤, 공병대는 상부의 명령을 기다리며 폭약 앞에 서 있었다. 다리 위에는 아직 피난민이 남아 있었다.

공병 대대장은 무전기에 대고 몇 번이고 같은 말을 되물었다. "사령부, 다리 위에 민간인이 있습니다. 확인해 주십시오. 이대로 폭파하면 저 사람들은 강으로 떨어집니다. 폭파를 늦추면 적 전차가 바로 넘어옵니다. 저는 어느 쪽이든 명령을 따르겠습니다. 다만 그 명령을 내린 사람이 누구인지는 꼭 알고 싶습니다."

정부는 세종으로 옮겨 갔다. 수도를 잃은 나라에서 사람들은 처음으로 이 전쟁에서 질 수도 있다는 걸 실감했다.`,
  pre: () => { S.capital = 'KOR_CC'; },
  opts: [
    { t: '민간인이 건너간 뒤 폭파합니다', h: '안정도 −8 · 전쟁 지지 +14 · 군사력 −4', fx: () => { A('stab', -8); A('ws', 14); A('mil', -4); } },
    { t: '즉시 폭파합니다', h: '안정도 −14 · 전쟁 지지 +8 · 종교계·대학 불만 +8', fx: () => { A('stab', -14); A('ws', 8); G({ relig: 8, univ: 8 }); } },
    { t: '다리를 지키며 버팁니다', h: '안정도 +4 · 종교계 불만 −4 · 다음 분기 적 공세 강화', fx: () => { A('stab', 4); G({ relig: -4 }); if (S.war) S.war.bonusE += 1; } },
  ] },

nakdong: {
  title: '낙동강의 재림', tags: ['KOR'],
  text: `전선은 낙동강까지 밀려 내려왔다. 대구의 지하철역마다 피난민이 가득했고, 부산항에는 배를 기다리는 줄이 끝없이 이어졌다.

강태준은 지도 위의 좁아진 파란 영역을 오래 내려다봤다. "칠십여 년 전 이 강에서 우리는 버텼습니다. 그때는 바다 건너에서 누군가 와줬어요. 지금 우리가 기댈 수 있는 사람이 남아 있다면, 바로 지금 불러야 합니다. 그게 아니라면 이 강에서 끝까지 싸우든지, 아니면 정부만이라도 바다 건너로 옮길 준비를 해야 합니다. 어느 쪽이든 오늘 밤 안에 정해 주셔야 합니다."`,
  opts: [
    { t: 'PDTO 상륙 지원을 요청합니다', h: 'PDTO 회원만 · 전시 군사력 ×1.35', if: () => S.spirits.includes('pdto'), fx: () => { S.flags.pdtoLanding = true; A('mil', 6); L('PDTO 연합군이 포항과 울산에 상륙했다.'); } },
    { t: '이 강에서 끝까지 싸웁니다', h: '전쟁 지지 +15 · 군사력 +6', fx: () => { A('ws', 15); A('mil', 6); } },
    { t: '정부 이전을 준비합니다', h: '안정도 −10 · 본토를 잃어도 제주에서 임시정부로 버틴다(준비하지 않으면 동맹 없이 전부 잃습니다)', fx: () => { A('stab', -10); S.flags.jejuReady = true; } },
  ] },

exile: {
  title: '섬의 정부', tags: ['KOR'],
  text: `부산이 함락된 날, 마지막 수송선이 제주항에 닿았다. 배에서 내린 사람들 중에는 국무위원 몇과 국회의원 몇, 그리고 끝까지 남은 군인들이 있었다.

한도윤은 비 내리는 부두에서 대통령 곁에 섰다. "본토에는 이제 우리 깃발이 없습니다. 그런데 백 년 전에도 이 나라는 땅 없이 버틴 적이 있어요. 상하이의 작은 건물에서요. 그때 사람들은 이 나라가 다시 돌아올 거라고 믿었고, 실제로 돌아왔습니다. 저는 그 사람들보다 덜 믿을 이유가 없다고 생각합니다. 여기서부터 다시 시작하죠."`,
  pre: () => { endWar('exile'); S.route = 'exile'; S.korName = '대한민국 임시정부'; },
  opts: [{ t: '임시정부를 선포합니다', h: '엔딩', fx: () => triggerEnding('jeju') }] },

truce: {
  title: '판문점의 테이블', tags: ['KOR'],
  text: () => S.war && S.war.peninsula ? `전선은 몇 분기째 움직이지 않았다. 양쪽 모두 지쳤고, 중립국 대표단이 판문점에 다시 테이블을 놓았다.

정부 대표단장은 출발 전 대통령에게 물었다. "지금 이대로 서명하면 현재 전선이 새 경계선이 됩니다. 지금 상태로는 ${OUTN[classify()]}입니다. 더 싸우면 더 얻을 수도 있고, 더 잃을 수도 있어요. 국민들은 지쳤습니다. 그렇지만 지친 국민들이 받아들일 수 없는 선도 있겠지요. 그 선이 어디인지는 제가 아니라 대통령께서 정하셔야 합니다."` : `전선은 몇 분기째 제자리였다. 제3국 외교관들이 정전 협상을 중재하겠다고 나섰다. 지금 서명하면 우리가 점령한 땅은 우리 손에 남고, 상대는 그 사실을 인정하지 않은 채 다음을 기다릴 것이다.

국방부 장관은 지도 위의 새 경계선을 손가락으로 짚었다. "이 선을 지키려면 앞으로 몇 년, 어쩌면 몇십 년 동안 병력을 묶어둬야 합니다. 저쪽은 이 선을 잊지 않을 겁니다. 다만 지금 더 밀어붙였다가 무너지면, 그때는 이 선마저 지킬 수 없겠지요."`,
  opts: [
    { t: '정전에 서명합니다', h: () => S.war && S.war.peninsula ? `전쟁 종료: ${OUTN[classify()]}` : '현재 전선에서 전쟁 종료 · 점령지는 유지', fx: () => endWar(S.war && S.war.peninsula ? classify() : null) },
    { t: '계속 싸웁니다', h: '전쟁 지지 −5', fx: () => { A('ws', -5); } },
    { t: '서명하되 비무장지대를 넓힙니다', h: '전쟁 종료 · 전쟁 지지 −5 · 안정도 +4', fx: () => { endWar(S.war && S.war.peninsula ? classify() : null); A('ws', -5); A('stab', 4); } },
  ] },

pyongyang: {
  title: '평양 입성', tags: ['KOR'],
  text: `선두 전차가 대동강 다리를 건넜다. 김일성광장에는 아무도 없었다. 거대한 초상화 아래로 국군 병사들이 조심스럽게 걸어 들어갔고, 누군가가 주체사상탑 꼭대기를 올려다봤다.

종군 기자의 카메라 앞에서 한 소대장이 말했다. "솔직히 기쁘다는 생각보다는 이상하다는 생각이 먼저 듭니다. 어릴 때부터 지도에서 보기만 하던 도시잖아요. 여기 사람들이 우리를 어떻게 볼지도 모르겠고요. 해방군으로 볼지, 점령군으로 볼지. 그건 저희가 앞으로 어떻게 하느냐에 달린 거겠지요."`,
  opts: [
    { t: '계속 북으로', h: '안정도 +5 · 전쟁 지지 +6', fx: () => { A('stab', 5); A('ws', 6); } },
    { t: '평양 시민 구호부터 시작합니다', h: '경제 −3 · 평판 +6 · 훗날 북부 저항 감소', fx: () => { A('econ', -3); A('rep', 6); S.flags.pyCare = true; } },
    { t: '광장의 동상을 끌어내립니다', h: '전쟁 지지 +10 · 평판 −2 · 훗날 북부 저항 증가', fx: () => { A('ws', 10); A('rep', -2); S.flags.pyStatue = true; } },
  ] },

lastshot: {
  title: '마지막 포성', tags: ['KOR'],
  text: `북한 정권은 생각보다 빠르게 무너졌다. 평양을 잃은 뒤 지휘 계통이 끊겼고, 남은 군단들은 하나둘씩 백기를 들었다. 마지막까지 버티던 부대가 혜산에서 항복한 날, 휴전선이라는 말은 칠십여 년 만에 뜻을 잃었다.

광화문에는 사람들이 모였다. 이번에는 아무도 무언가를 반대하러 나온 게 아니었다. 한 할머니가 북쪽 고향 마을 이름을 적은 종이를 들고 서 있었다. 기자가 다가가자 그녀는 이렇게 말했다. "살아서 이걸 볼 줄은 몰랐어요. 그런데 이제부터가 더 어려울 거라는 것도 알아요. 칠십 년 동안 따로 산 사람들이 하루아침에 한 집 식구가 될 수는 없잖아요."`,
  pre: () => { owned('PRK').forEach(id => capture(id, 'KOR')); PRK_IDS.forEach(id => { if (S.occ[id] != null) S.occ[id] = clamp(S.occ[id] + (S.flags.pyCare ? -15 : 0) + (S.flags.pyStatue ? 10 : 0), 0, 100); }); S.outcome = '4A'; S.korName = '통일 대한민국'; S.defeated.PRK = 'annex'; removeEnemy('PRK'); },
  opts: [
    { t: '통일을 선포합니다', h: '통일 대한민국 · 북부는 점령지로 통합', fx: () => { A('stab', 10); A('rep', 8); } },
    { t: '북부 자치구를 두고 천천히 통합합니다', h: '북부 저항 크게 감소 · 경제 −3 · 평판 +6', fx: () => { PRK_IDS.forEach(id => { if (S.occ[id] != null) S.occ[id] = Math.max(10, S.occ[id] - 20); }); A('econ', -3); A('rep', 6); A('stab', 6); } },
    { t: '북부 지도부를 전범 재판에 세웁니다', h: '전쟁 지지 +8 · 안정도 +6 · 북부 저항 +10', fx: () => { A('ws', 8); A('stab', 6); PRK_IDS.forEach(id => { if (S.occ[id] != null) S.occ[id] = Math.min(100, S.occ[id] + 10); }); } },
  ] },

yalu: {
  title: '압록강의 휴전 제안', tags: ['CHN', 'KOR'],
  text: `국군이 압록강과 두만강 남쪽을 모두 장악하자, 베이징은 처음으로 협상을 제안했다. 조건은 단 하나였다. 국군은 강을 건너지 않는다. 그 대신 중국군도 강 남쪽에서 물러난다.

강태준은 말했다. "이 정도면 칠십 년 전에 우리가 놓친 걸 되찾은 겁니다. 강을 건너는 순간 이건 북한과의 전쟁이 아니라 중국과의 전쟁이 됩니다. 저는 군인이라 싸우라면 싸웁니다. 그렇지만 이번만큼은, 여기서 멈추는 것도 용기라고 말씀드리고 싶습니다."`,
  opts: [
    { t: '휴전을 받아들입니다', h: '북진 통일 완성 · 중국과 정전', fx: () => { owned('PRK').forEach(id => capture(id, 'KOR')); S.outcome = '4A'; S.korName = '통일 대한민국'; S.defeated.PRK = 'annex'; S.flags.chinaHostile = true; endWar('4A'); } },
    { t: '제안을 거절하고 강을 건넙니다', h: '중국과 전면전 · 만주로 진격할 수 있습니다', fx: () => { A('ws', -4); S.war.cnLimited = false; A('rep', -8); } },
  ] },

refugee: {
  title: '국경의 피난민', tags: ['PYG', 'HAM', 'SAR'], when: s => s.outcome === 'warlords' && s.turn >= (s.flags.coupTurn || 0) + 2,
  text: `휴전선 철책 앞에 사람들이 모여들었다. 북쪽 군벌들의 싸움을 피해 내려온 사람들이었다. 처음엔 몇십 명이었고, 몇 주 뒤에는 셀 수 없게 됐다.

연천의 한 초소장은 상부에 같은 질문을 반복했다. "이 사람들을 들여보내야 합니까, 막아야 합니까. 들여보내면 그중에 누가 섞여 있을지 저는 모릅니다. 막으면 저는 철책 너머에서 사람들이 얼어 죽는 걸 지켜봐야 합니다. 둘 중 무엇을 하든 저는 따르겠습니다. 다만 나중에 누군가 이걸 물어볼 때, 결정한 사람이 저 혼자가 아니었으면 좋겠습니다."`,
  opts: [
    { t: '철책을 엽니다', h: '평판 +8 · 노동·종교계 불만 +5 · 인구 위기 −4', fx: () => { A('rep', 8); G({ labor: 5, relig: 5 }); A('popc', -4); } },
    { t: '철책을 닫습니다', h: '평판 −8 · 종교계 불만 +8', fx: () => { A('rep', -8); G({ relig: 8 }); } },
    { t: '심사를 거쳐 선별 수용합니다', h: '평판 +2 · 노동·종교계 불만 +2 · 인구 위기 −2', fx: () => { A('rep', 2); G({ labor: 2, relig: 2 }); A('popc', -2); } },
  ] },

union: {
  title: '두 조선 연합', tags: ['KOR', 'PYG'], when: s => s.flags.backPYG && s.turn >= (s.flags.coupTurn || 0) + 4 && owned('PYG').length >= 3,
  text: `리광천은 판문점에 직접 나왔다. 군복 대신 낡은 양복을 입고 있었다.

"우리가 서울의 도움으로 버틴 건 사실입니다. 그걸 부정하지는 않겠습니다. 다만 평양 사람들은 아직 서울을 모릅니다. 칠십 년 동안 적이라고 배운 사람들이에요. 하루아침에 같은 나라라고 하면 그들은 점령당했다고 느낄 겁니다. 그래서 저는 연합을 제안합니다. 하나의 나라, 그러나 당분간은 두 개의 정부. 시간이 지나면 사람들이 스스로 그 벽을 허물 겁니다. 우리가 대신 허물어주지 않아도요."`,
  opts: [
    { t: '연합을 받아들입니다', h: '평양 과도위 영토 통합 · 두 조선 연합', fx: () => { owned('PYG').forEach(id => { capture(id, 'KOR'); S.occ[id] = 22; }); S.outcome = 'union'; S.flags.warlords = false; S.flags.warEnd = S.turn; A('stab', 6); A('rep', 8); L('두 조선 연합 협정이 체결됐다.'); } },
    { t: '흡수를 요구합니다', h: '평양 과도위 영토 통합 · 북부 저항 증가', fx: () => { owned('PYG').forEach(id => capture(id, 'KOR')); S.outcome = 'union'; S.flags.warlords = false; S.flags.warEnd = S.turn; S.flags.partisan = 40; sp('partisan'); A('rep', -4); } },
  ] },

northfall: {
  title: '신의주의 오성홍기', tags: ['SAR', 'CHN'],
  text: `군벌들의 싸움은 결국 가장 든든한 뒷배를 가진 쪽이 이겼다. 중국의 보급을 받은 조선 특별행정구가 평양과 함흥을 차례로 장악했다. 베이징은 '조선 인민의 자결에 따른 특별행정 체제'를 발표했다.

휴전선 너머의 이웃은 이제 북한이 아니라 중국이었다. 강태준은 짧게 말했다. "칠십 년 동안 우리가 막아온 건 평양이 아니라 그 뒤에 있는 나라였는지도 모르겠습니다. 이제는 그 나라가 바로 철책 너머에 서 있어요."`,
  opts: [
    { t: '국경을 요새화합니다', h: '군사력 +5 · 경제 −2 · 군 소장파 +3', fx: () => { S.flags.warEnd = S.turn; A('stab', -4); A('mil', 5); A('econ', -2); G({ junior: 3 }); } },
    { t: '베이징과 국경 협정을 맺습니다', h: '중국 반감 해소 · 군 소장파 +8', fx: () => { S.flags.warEnd = S.turn; A('stab', -2); S.flags.chinaAngry = false; G({ junior: 8 }); } },
    { t: '북쪽 망명자들의 임시정부를 지원합니다', h: '평판 +4 · 중국 반감', fx: () => { S.flags.warEnd = S.turn; A('stab', -6); A('rep', 4); S.flags.chinaAngry = true; } },
  ] },

emergencyEnd: {
  title: '비상의 끝', tags: ['KOR'], when: s => !s.war && s.cabinet === 'grand' && s.route === 'normal' && ['4B', '4C', '4L', 'split', 'warlords'].includes(s.outcome) && s.turn >= (s.flags.warEnd ?? s.flags.coupTurn ?? 0) + 1,
  text: `포성이 멈추고 한 달이 지났을 때, 청와대 지하 회의실에는 전쟁 내내 그 자리를 지켜온 사람들이 그대로 앉아 있었다. 바뀐 건 벽에 걸린 상황판이 꺼져 있다는 것뿐이었다.

국무총리 정태헌이 먼저 서류를 넘겼다. "오늘 결정해야 할 건 하나입니다. 비상조치를 예정대로 이번 달 말에 풀 거냐, 아니면 연장할 거냐. 법적으로는 국회 동의만 있으면 연장이 가능합니다. 그리고 지금 국회 의석은 사실상 여기 앉아 계신 분들 것이고요. 그러니까 이건 법의 문제가 아니라, 우리가 무엇을 원하느냐의 문제입니다."

국정원장 출신 안보특보 윤재석이 의자에 등을 기댔다. "북쪽 전선이 조용하다고 끝난 게 아닙니다. 전쟁 중에 잡아낸 간첩망은 일부일 뿐이고, 남은 놈들이 휴전을 기회로 다시 움직일 겁니다. 지금 비상조치를 풀면, 집회 하나에도 누가 섞여 들어오는지 우리가 알 방법이 없어집니다. 저는 국민들이 전쟁 때 참아준 걸 고맙게 생각합니다. 그래서 더더욱 그 희생을 헛되게 만들 수는 없다고 봅니다."

회의실 끝에 앉아 있던 서은수가 조용히 말을 받았다. "특보님 말씀이 틀렸다는 게 아닙니다. 다만 한시적 연장이라는 말이 지금까지 한 번도 한시적으로 끝난 적이 없다는 걸 우리 모두 알고 있잖아요. 한 번 연장하면, 다음 연장 때는 이유를 찾는 게 더 쉬워집니다. 그리고 그때쯤이면 이걸 풀자고 말하는 사람이 이 방에 남아 있을지도 모르겠습니다."

정태헌은 오래 대답하지 않았다. 창문 없는 회의실에서는 바깥에 비가 오는지도 알 수 없었다.`,
  opts: [
    { t: '한시적으로 연장합니다', h: '「유리 공화국」 루트 진입 · 거국내각이 공화연합으로 굳습니다', fx: () => enterGlass(0) },
    { t: '연장하되 국민투표에 부칩니다', h: '「유리 공화국」 루트 진입 · 개혁파가 강한 상태로 시작', fx: () => enterGlass(1) },
    { t: '예정대로 해제합니다', h: '정상 전후 정치 · 거국내각 해산', fx: () => { unsp('grand'); S.cabinet = 'assembly'; A('stab', 4); Gall(-6); L('비상조치가 예정대로 해제됐다.'); } },
  ] },

juntaChoice: {
  title: '계엄사령관의 선택', tags: ['KOR'], when: s => !s.war && s.cabinet === 'military' && s.route === 'normal' && s.outcome && s.outcome !== 'exile' && s.turn >= (s.flags.warEnd ?? 0) + 1,
  text: `휴전 협정에 서명한 다음 날, 강태준은 계엄사령부 집무실에서 국방부 장관 한도윤과 마주 앉았다. 둘 다 오랫동안 잠을 자지 못한 얼굴이었다.

한도윤이 먼저 입을 열었다. "약속하신 대로라면 이제 권한을 돌려주실 때입니다. 국회는 다시 열 준비가 돼 있어요. 의장실에서도 날짜만 정해 달라고 합니다."

강태준은 창밖 연병장을 보며 말했다. "압니다. 그런데 장관님, 지금 이 나라에 국회를 다시 열어서 뭘 하게 될지 생각해 보셨습니까. 전쟁 책임을 따지는 청문회, 서로를 향한 고발, 그리고 그 사이에 평양은 다시 포를 정비하겠지요. 저도 권력이 탐나서 이러는 게 아닙니다. 다만 지금 손을 놓으면, 우리가 지킨 것들이 말싸움 속에서 다 흩어질까 봐 두려운 겁니다."

"그 두려움이 사령관님만의 것은 아닙니다." 한도윤이 말했다. "그런데 그걸 핑계로 남아 있던 사람들이 역사에서 어떻게 불렸는지도 사령관님은 잘 아실 겁니다."`,
  opts: [
    { t: '민정 이양을 선언합니다', h: '정상 전후 정치 · 군 소장파 불만 해소', fx: () => { unsp('martial'); S.cabinet = 'assembly'; G({ junior: -15, univ: -8 }); A('rep', 8); L('계엄이 해제되고 민정이 이양됐다.'); } },
    { t: '군정을 유지합니다', h: '「군정의 겨울」 루트 · 정치력 증가 · 사회 전반 반발', fx: () => { unsp('martial'); S.route = 'junta'; sp('junta'); sp('silence'); A('rep', -15); G({ univ: 10, junior: 6 }); L('계엄사령부가 국가재건위원회로 이름을 바꿨다.'); } },
    { t: '시한부 군정을 약속합니다', h: '군정 루트 · 몇 년 뒤 약속한 선거를 치를지 다시 정합니다', fx: () => { unsp('martial'); S.route = 'junta'; sp('junta'); A('rep', -6); G({ univ: 4 }); S.flags.juntaTimer = S.turn + 12; L('국가재건위원회가 민정 이양 일정을 발표했다.'); } },
  ] },

unreg: {
  title: '등록되지 않은 집회', tags: ['KOR'], when: s => s.route === 'glass' && s.turn >= s.flags.glassStart + 2,
  text: `신촌 지하철역 출구 앞에는 피켓도 깃발도 없었다. 사람들은 그냥 서 있었다. 각자 손에 꺼진 휴대폰을 하나씩 들고 있었다. 화면이 꺼진 휴대폰을 들고 서 있는 것, 그게 요즘 신고 없이 할 수 있는 유일한 시위였다.

관할 경찰서장 권민혁은 차 안에서 그 장면을 한참 지켜봤다. 옆자리의 정보과 형사가 태블릿을 내밀었다. "서장님, 통합관제 쪽에서 얼굴 대조는 다 끝났답니다. 학생이 대부분이고, 노조 쪽 사람이 몇 섞여 있어요. 해산 명령을 내리면 바로 움직일 수 있습니다. 위에서는 오늘 안에 정리됐으면 좋겠다고 합니다."

권민혁은 태블릿을 받지 않았다. "해산 명령을 내리려면 이게 불법 집회여야 하잖아. 저 사람들은 구호도 안 외치고 아무것도 안 들었어. 그냥 서 있는 거야. 서 있는 사람들을 끌고 가면, 내일 아침 기사 제목이 뭐가 될지 생각해 봤어? 아니, 기사는 안 나가겠지. 그런데 안 나간다는 걸 저 사람들도 다 안다고. 그래서 더 무서운 거야. 우리가 오늘 저기서 누굴 끌고 가든, 저 사람들은 다음 주에 두 배로 와서 또 서 있을 거다."`,
  opts: [
    { t: '해산시킵니다', h: '공안파 +8 · 대학 불만 +12 · 압력 +8', fx: () => { F({ gongan: 8 }); G({ univ: 12, junior: 3 }); P(8); } },
    { t: '지켜보기만 합니다', h: '관리파 +4 · 서장 징계', fx: () => { F({ gwanri: 4 }); G({ univ: 3 }); } },
    { t: '서장의 보고를 개혁파에게 넘깁니다', h: '개혁파 +10 · 공안파와 내부 갈등', fx: () => { F({ gaehyeok: 10, gongan: -4 }); A('stab', -3); } },
  ] },

leak: {
  title: '유출', tags: ['KOR'],
  text: `새벽 한 시, 해외 탐사보도 매체 하나가 파일을 공개했다. 통합관제센터 내부 문서였다. 집회 참가자 명단과 그들의 대출 심사 결과, 채용 탈락 기록이 한 줄로 이어져 있었다. 알고리즘은 국내에서 그 기사를 지웠지만, 해외 교민들의 메신저에서는 지울 수 없었다.

윤재석은 아침 회의에서 단호했다. "이건 외국 정보기관의 공작입니다. 문서 일부는 조작됐을 가능성이 높아요. 지금 우리가 흔들리면 그게 바로 저쪽이 원하는 겁니다. 전면 부인하고, 유출자는 찾아내야 합니다."

서은수는 그 말이 끝나기를 기다렸다가 입을 열었다. "특보님, 그 문서 조작된 거 아닙니다. 제가 결재한 양식이 그대로 들어 있어요. 우리가 지금 부인하면 다음 유출 때는 아무도 우리 말을 안 믿을 겁니다. 저는 차라리 지금 사과하는 게 낫다고 봅니다. 늦게 하는 사과는 사과가 아니라 항복이 되니까요."`,
  opts: [
    { t: '전면 부인합니다', h: '공안파 +6 · 압력 +15 · 교민 불만 +10 · 평판 −6', fx: () => { F({ gongan: 6 }); P(15); G({ dias: 10 }); A('rep', -6); } },
    { t: '내부 감찰에 착수합니다', h: '관리파 +5 · 개혁파 +5 · 대학 불만 +8 · 안정도 −5', fx: () => { F({ gwanri: 5, gaehyeok: 5 }); G({ univ: 8 }); A('stab', -5); } },
    { t: '공개 사과합니다', h: '개혁파 +15 · 안정도 −10 · 「광장의 침묵」 해제(쌓인 압력이 터집니다)', fx: () => { F({ gaehyeok: 15 }); A('stab', -10); A('surv', -1); unsp('silence'); } },
  ] },

crack: {
  title: '둑에 금이 가다', tags: ['KOR'],
  text: `아무 일도 없던 화요일이었다. 지방 소도시의 한 고등학생이 학교 게시판에 손으로 쓴 대자보를 붙였다. 알고리즘은 그 사진을 지웠지만, 그 학교 학생들은 사진이 아니라 실물을 봤다. 다음 날 옆 학교에 같은 대자보가 붙었다.

정태헌은 보고서를 읽다가 손을 멈췄다. "우리는 지금까지 사람들이 조용한 걸 사람들이 만족한 걸로 착각했던 겁니다. 조용하다는 건 말할 곳이 없다는 뜻이었어요. 이제 그 사람들이 말할 곳을 찾기 시작했습니다. 물이 차오를 대로 차오른 둑은 어디 한 군데만 금이 가도 충분하지요."`,
  opts: [{ t: '계속', h: '「광장의 침묵」 해제 · 쌓인 압력이 모든 사회 갈래로 터집니다', fx: () => { if (S.spirits.includes('silence')) unsp('silence'); else releasePress(); A('stab', -10); } }] },

candle: {

  text: `광화문 광장에 다시 촛불이 켜졌다. 전쟁과 물가와 일자리, 사람들이 들고 나온 구호는 저마다 달랐지만 끝에 붙는 말은 같았다. 이대로는 못 살겠다는 것이었다.

청와대 비서실장은 대통령에게 세 가지 안을 올렸다. "첫째, 내각을 바꾸고 요구 일부를 받아들이는 겁니다. 정치적으로 대가가 크지만 광장은 가라앉을 거예요. 둘째, 그냥 기다리는 겁니다. 촛불은 대개 계절이 바뀌면 줄어듭니다. 셋째, 경찰력을 동원하는 겁니다. 그건 가장 빠르지만, 이 나라에서 그 방법이 끝까지 통한 적은 한 번도 없었습니다."`,

plaza: {
  title: '광장의 귀환', tags: ['REB', 'KOR'],
  text: () => `그날은 비가 왔다. 그런데도 사람들은 서울광장에서 광화문까지, 그리고 세종대로를 넘어 종로까지 가득 찼다. 집회 신고는 아무도 하지 않았다. 할 수 있는 방법이 없었으니까. 부산 서면에서도, 광주 금남로에서도, 대구 동성로에서도 같은 일이 동시에 일어났다.

대학생 대표 이하은은 확성기도 없이 맨목소리로 말했다. "우리는 선거를 해왔습니다. 투표도 했고, 개표도 봤어요. 그런데 몇 번을 해도 결과가 같았습니다. 그래서 오늘은 투표용지 대신 우리 몸을 들고 나왔습니다. 저는 이 나라가 민주주의라고 배웠어요. 그 말이 거짓말이 아니라는 걸, 오늘 이 자리에서 확인하고 싶습니다."

노조 위원장 박무열이 그 옆에 섰다. "우리는 공장을 멈췄습니다. 이 나라를 망치려는 게 아니라, 이 나라가 우리 것이라는 걸 보여주려고요."

${S.route === 'junta' ? '국가재건위원회' : '공화연합 지도부'}는 밤새 회의를 이어갔다. 선택지는 셋뿐이었다.`,
  opts: [
    { t: '협상 테이블을 엽니다', h: '개혁파 +20 · 모든 불만 −12', if: () => S.route === 'glass', fx: () => { F({ gaehyeok: 20 }); Gall(-12); S.done.plaza = false; S.flags.plazaCool = S.turn; } },
    { t: '해산 명령을 내립니다', h: () => `군 소장파 불만 ${Math.round(S.g.junior)} — 60 이상이면 군이 발포를 거부합니다`, fx: () => Q('fireorder') },
    { t: '지도부가 총사퇴합니다', h: '엔딩: 다시 광장으로', fx: () => triggerEnding('plaza') },
  ] },

fireorder: {
  title: '발포 명령', tags: ['KOR'],
  text: () => S.g.junior >= 60
    ? `명령은 내려갔다. 그러나 광화문 앞에 선 수도방위사령부 병력은 움직이지 않았다. 한 대대장이 무전기를 내려놓고 헬멧을 벗었다. 그 뒤로 병사들이 하나둘 총구를 땅으로 내렸다.

그 대대장은 나중에 이렇게 말했다. "저 앞에 서 있는 사람들 중에 제 동생 같은 애들이 있었습니다. 저는 이 나라를 지키려고 군인이 됐지, 이 나라 사람들을 쏘려고 된 게 아닙니다. 명령 불복종으로 처벌받는다면 받겠습니다. 그래도 그날 쏘지 않은 건 후회하지 않을 겁니다."`
    : (S.st.surv >= 3 && S.fac.gongan >= 40)

윤재석은 회의실에서 짧게 말했다. "끝났습니다." 서은수는 대답하지 않았다. 그녀는 그날 오후 사직서를 냈고, 그 사직서는 수리되지 않은 채 서랍 속에 들어갔다.`
      : `명령은 내려갔고 총성이 울렸다. 그러나 사람들은 흩어지지 않았다. 오히려 다음 날 더 많은 사람이 나왔고, 그다음 날에는 지방 도시의 시청들이 하나둘 시민들의 손에 넘어갔다. 군은 갈라졌다. 어떤 부대는 명령을 따랐고, 어떤 부대는 시민 편에 섰다.

나라는 둑이 무너지듯 무너지기 시작했다. 그리고 휴전선 너머에서, 누군가 그 광경을 아주 오래 기다려 왔다는 듯이 지켜보고 있었다.`,
  opts: [{ t: '계속', h: '', fx: () => {

    else if (S.st.surv >= 3 && S.fac.gongan >= 40) { for (const k in S.g) S.g[k] = 18; P(40); A('rep', -30); F({ gongan: 15 }); S.flags.crushed = true; S.done.plaza = false; S.flags.plazaCool = S.turn + 8; }
    else { const reb = owned('KOR').filter(id => unrestOf(id) >= 55 && id !== S.capital); setOwn(reb.length ? reb : ['KOR_JL', 'KOR_GN'], 'REB'); triggerEnding('dam'); }
  } }] },

gonganNight: {
  title: '공안파의 밤', tags: ['KOR'],
  text: () => `비상조치 해제 선언이 발표된 그날 밤, 국정원 청사에 불이 꺼지지 않았다. 윤재석은 수도권 일부 부대 지휘관들과 통화를 이어가고 있었다.

정태헌은 집무실에서 서은수와 마주 앉아 있었다. "윤 특보가 움직일 겁니다. 오늘 밤이 아니면 다음 주에라도요. 우리가 할 수 있는 건 군이 어느 편에 설지 기다리는 것뿐이에요. 저는 이 비상조치를 만든 사람 중 하나입니다. 그걸 푸는 것도 제 손으로 하고 싶었습니다. 그게 제가 이 나라에 할 수 있는 마지막 일인 것 같아서요."

서은수가 말했다. "총리님, 군이 우리 편에 설지는 모르겠습니다. 그렇지만 국민들은 이미 우리 편이에요. 그건 오늘 처음으로 알게 됐습니다."${springOK() ? '' : '\n\n그러나 그날 새벽, 수도권의 장갑차들은 국정원의 명령을 따라 움직였다.'}`,
  opts: [{ t: '계속', h: () => springOK() ? '군과 관료가 개혁파 편에 선다' : '공안파가 실권을 쥔다', fx: () => { if (springOK()) triggerEnding('spring'); else triggerEnding('gongan'); } }] },

stopclock: {
  title: '멈춘 시계', tags: ['KOR'],
  text: `국가안전보장회의는 '전시에 준하는 상황'이 끝날 때까지 모든 선거를 연기한다고 발표했다. 그 상황이 언제 끝나는지는 발표문 어디에도 없었다.

윤재석은 기자회견장에서 이렇게 말했다. "우리는 민주주의를 포기하는 게 아닙니다. 민주주의를 지킬 수 있는 조건을 먼저 만드는 겁니다. 집이 불타고 있는데 누가 집주인인지 투표로 정할 수는 없지 않습니까."

그날 이후로 사람들은 그 문장을 자주 떠올렸다. 집이 다 타고 나면 그때는 누가 투표를 하게 되는 걸까.`,

  text: () => `통계청 발표가 나온 날, 산부인과 몇 곳이 문을 닫는다는 기사가 같은 지면에 실렸다. 초등학교 입학식이 열리지 않는 군이 늘어났고, 지방 소도시의 버스 노선은 하나둘 사라졌다.

서은수는 보고서 첫 장을 넘기지 않은 채 말했다. "전쟁보다 무서운 게 있다면 이거예요. 포탄은 눈에 보이지만 이건 안 보이거든요. 길은 세 가지입니다. 사람을 바깥에서 데려오는 것, ${['4A', 'union', '4B', 'split'].includes(S.outcome) ? '북쪽 사람들을 한 노동시장으로 흡수하는 것, ' : ''}아니면 사람이 없어도 돌아가는 나라를 만드는 것. 어느 쪽이든 지금 시작하지 않으면 다음 세대에게는 고를 기회조차 없을 겁니다."`,

    { t: '자동화 국가로 갑니다', h: '경제 성장 · 노동 반발 · 전투 인력 감소', fx: () => { sp('auto'); } },

// 선거(유리 공화국)
function makeElection(id, offset, label) {
  EV[id] = {
    title: label, tags: ['KOR'], when: s => s.route === 'glass' && s.turn >= s.flags.glassStart + offset,
    text: () => { const sh = electShare(); return `공화연합은 이번에도 두 계파의 후보를 냈다. 텔레비전 토론은 치열했고, 서로를 향한 비판은 날카로웠다. 그러나 두 후보 모두 비상조치 해제에 대해서는 같은 말을 했다. 아직 때가 아니라고.

연합 밖의 후보들은 등록 심사를 통과하지 못했거나, 통과했어도 포털 검색 결과에 잘 나오지 않았다. 투표율은 낮았다. 그리고 개표 결과가 나오기 직전, 관리파 실무진이 예상 득표율을 들고 왔다. 공화연합 ${sh}%.

서은수가 숫자를 보며 말했다. "${sh < 50 ? '과반이 안 됩니다. 처음이에요. 이 숫자를 그대로 발표하면 연합 안에서 누군가는 책임을 져야 할 겁니다. 반대로 이 숫자를 고치면, 우리는 다시는 고치지 않은 숫자를 발표할 수 없게 될 거고요.' : '과반은 넘었습니다. 다만 지난번보다 사람들의 침묵이 더 길어졌어요. 숫자가 이기고 있는 동안에도, 우리가 뭔가를 잃고 있다는 느낌은 지울 수가 없네요.'}"`; },
    opts: [
      { t: '결과를 그대로 발표합니다', h: () => electShare() < 50 ? '연합 과반 붕괴 · 개혁파 +22 · 공안파 반발' : '공화연합 승리 · 관리파 +4', fx: () => { const sh = electShare(); if (sh < 50) { F({ gaehyeok: 22, gongan: -6 }); Gall(-6); L('공화연합이 처음으로 과반을 잃었다.'); } else { F({ gwanri: 4 }); A('stab', 2); } } },
      { t: '개표를 관리합니다', h: '득표율 54%로 발표 · 압력 +15 · 유출 위험 증가', fx: () => { P(15); S.flags.rigged = true; F({ gongan: 4 }); G({ univ: 6 }); } },
    ],
  };
}
let _share = null;
function electShare() {
  if (_share !== null) return _share;
  let sh = 58 - avgG() * 0.35 + (S.focus.el2 ? 8 : 0) + S.st.surv * 1.5 + rnd(-4, 4);
  if (!S.focus.el3) sh -= 2;
  _share = Math.round(clamp(sh, 20, 80));
  return _share;
}
makeElection('gelect1', 4, '관리된 선거 — 총선');
makeElection('gelect2', 12, '관리된 선거 — 대선');
makeElection('gelect3', 20, '관리된 선거 — 지방선거');
[28, 36, 44, 52, 60, 68, 76, 84, 92, 100, 108, 116].forEach((o, i) => makeElection('gelect' + (4 + i), o, ['관리된 선거 — 총선', '관리된 선거 — 대선', '관리된 선거 — 지방선거'][i % 3]));

function springOK() { return S.g.junior >= 40 || S.fac.gaehyeok >= 50 || S.st.mil < 60; }
function coupChance() { return clamp(0.42 + (S.gov === 'pro' ? 0.12 : 0) + (S.flags.chinaWeak ? 0.08 : 0) - (S.flags.chinaStrong ? 0.08 : 0), 0.1, 0.8); }
function enterGlass(mode) {
  S.route = 'glass'; S.flags.glassStart = S.turn; S.korName = '대한민국';
  unsp('grand'); sp('emergency'); sp('silence');
  S.fac = mode === 1 ? { gongan: 30, gwanri: 34, gaehyeok: 36 } : { gongan: 38, gwanri: 40, gaehyeok: 22 };
  G({ junior: 4, univ: 6 });

  title: '반전의 거리', tags: ['KOR'],
  text: `대학가에서 시작된 반전 집회가 이제는 직장인들의 퇴근길까지 이어졌다. 전사자 명단이 길어질수록 사람들은 같은 질문을 했다. 우리는 왜 남의 나라 땅에서 죽어야 하느냐고.

국회 국방위원장은 대통령에게 말했다. "민주국가는 국민이 납득하지 못하는 전쟁을 오래 할 수 없습니다. 그게 약점이라고 말하는 사람도 있지만, 저는 그게 이 나라가 독재국가와 다른 점이라고 생각해요. 이제 국민에게 이 전쟁의 끝이 어디인지 말해줄 때입니다."`,
  opts: [

fatigue: {
  title: '제국의 피로', tags: ['KOR', 'INS'],
  text: `점령지에서 연이어 봉기가 일어났다. 철도는 밤마다 끊겼고, 수비대 막사는 불탔으며, 본국의 신문은 매일 아침 낯선 지명과 함께 전사자 이름을 실었다.

서은수는 국무회의에서 숫자 대신 질문을 꺼냈다. "우리가 저 땅을 가진 건지, 저 땅이 우리를 가진 건지 모르겠습니다. 예산의 상당 부분이 점령지 치안에 들어가고 있어요. 그 돈으로 우리 아이들 학교를 몇 개나 지을 수 있었을까요. 저는 철수하자는 게 아닙니다. 다만 지킬 수 있는 만큼만 갖자는 겁니다."

강태준은 반대했다. "한 번 물러서면 다음엔 더 많은 곳에서 들고 일어날 겁니다. 제국은 약해 보이는 순간 무너지기 시작해요."`,
  opts: [
    { t: '저항이 거센 점령지를 포기합니다', h: '저항 70 이상인 점령지를 원래 주인에게 돌려줍니다 · 안정도 +8 · 평판 +6', fx: () => { const ids = occIds().filter(id => S.occ[id] >= 70); ids.forEach(id => setOwn([id], NAT[ORIG[id]] && owned(ORIG[id]).length ? ORIG[id] : 'INS')); A('stab', 8); A('rep', 6); S.revolts = 0; L(`점령지 ${ids.length}곳에서 철수했다.`); } },
    { t: '군정으로 틀어쥡니다', h: '점령지 정책을 군정으로 · 평판 −10 · 군 소장파 +8', fx: () => { S.occPol = 'garrison'; A('rep', -10); G({ junior: 8 }); S.revolts = 0; } },
    { t: '점령지에 자치를 넓힙니다', h: '점령지 정책을 자치로 · 경제 −4 · 평판 +4 · 모든 점령지 저항 −8', fx: () => { S.occPol = 'autonomy'; A('econ', -4); A('rep', 4); occIds().forEach(id => S.occ[id] = Math.max(0, S.occ[id] - 8)); S.revolts = 0; } },
  ] },

외교부 차관은 짧게 보고했다. "저쪽 지도부는 우리가 지금 다른 데 신경 쓸 여유가 없다고 판단한 것 같습니다. 돈으로 붙잡을 수는 있어요. 다만 돈으로 붙잡은 충성은 다음에 더 비싼 값을 부르겠지요."`,

rusvoid: {
  title: '시베리아의 빈 막사', tags: ['RUS'], when: s => s.turn >= 24,
  text: `유럽에서 벌어진 전쟁이 러시아를 깊이 빨아들이고 있었다. 하바롭스크와 블라디보스토크의 병영은 절반 이상이 비었고, 극동 사령부의 장비는 철도에 실려 서쪽으로 떠났다.

국정원 분석관은 위성 사진을 넘기며 말했다. "모스크바는 지금 극동을 지킬 여력이 없습니다. 연해주에는 우리 교민과 기업이 꽤 많아요. 무언가를 하려면 지금이 그 어느 때보다 쉬운 시기입니다. 물론, 쉬운 시기에 한 일일수록 오래 대가를 치르는 법이지만요."`,

mngchoice: {
  title: '초원의 제3 이웃', tags: ['MNG'], when: s => s.turn >= 32 && owned('MNG').length,
  text: `울란바토르에서 온 대표단은 정중했지만 절박했다. 그들은 중국과 러시아 사이에 끼어 수백 년을 버텨온 나라였다.

몽골 외무장관은 통역 없이 영어로 말하다가, 마지막 문장만은 서툰 한국어로 했다. "우리는 늘 세 번째 이웃을 찾았습니다. 바다가 없는 나라에게 먼 나라 친구는 숨 쉴 구멍이에요. 한국이 그 구멍이 되어줄 수 있을까요."`,
  opts: [

cnecon: {
  title: '차이나 쇼크', tags: ['CHN'], when: s => s.turn >= 34 && !s.flags.chinaDefeated && (Math.random() < 0.08 || s.turn >= 46),
  text: `상하이 증시가 사흘 연속 폭락했다. 지방 정부의 부채가 한꺼번에 터졌고, 짓다 만 아파트 단지들이 유령 도시처럼 남았다. 베이징은 자본 유출을 막으려 국경의 문을 닫았다.

서은수는 이 소식을 두고 오래 고민했다. "중국이 흔들리면 우리 수출도 같이 흔들립니다. 그런데 동시에, 저 나라가 당분간 바깥을 볼 여유가 없어진 것도 사실이에요. 빠져나오는 자본과 기술자를 우리가 받을 수도 있습니다. 이걸 기회라고 불러도 되는지는 모르겠지만요."`,

indrise: {
  title: '히말라야 너머의 손', tags: ['IND', 'KOR'], when: s => s.turn >= 52 && owned('IND').length && !s.defeated.IND,

cnultimatum: {

  opts: [
    { t: '요구를 받아들입니다', h: '베이징 밀약 체제 · 중국 땅 반환 · 군 소장파 +12 · 평판 −8', fx: () => { const ids = Object.keys(S.own).filter(id => ORIG[id] === 'CHN' && owns(id)); setOwn(ids, 'CHN'); S.flags.finland = true; sp('finland'); G({ junior: 12 }); A('rep', -8); if (S.spirits.includes('pdto')) unsp('pdto'); S.flags.chinaAngry = false; } },

tokyo: {

      { t: `${tagName(d)} 편에서 참전합니다`, h: () => `${josa(tagName(a), '과와')} 전쟁 · ${josa(tagName(d), '과와')} 동맹 · 방어 전쟁으로 취급`, if: () => !S.spirits.includes('neutral') && !(S.align === 'china' && a === 'CHN') && contact(a, d), fx: () => { startAIWar(a, d, true); S.allies[d] = true; R(d, 40); S.just[a] = S.turn; const al = declareWar(a); S.war.defensive = true; L(`대한민국이 ${al.map(tagName).join('·')}과(와) 전쟁에 들어갔다.`); } },
      { t: '베이징을 지지합니다', h: () => `친중 진영일 때 · 중국 관계 +15 · ${tagName(d)} 관계 −30 · 평판 −4`, if: () => S.align === 'china' && a === 'CHN', fx: () => { startAIWar(a, d); R('CHN', 15); R(d, -30); A('rep', -4); } },
    ],
  };
}

let proDone = null;
function playPrologue() {
  const lines = [['1월 20일', '질병관리청, 원인불명 호흡기 질환 국내 첫 확진 발표'], ['2월 18일', '대구에서 집단 감염. 병상이 하루 만에 찼다'], ['3월 3일', '워싱턴 의사당 앞에서 시위대와 주 방위군이 충돌. 사망자가 나왔다'], ['3월 9일', '평양 조선중앙TV, 정규 방송을 끊고 군가만 내보내기 시작'], ['3월 10일', '새벽 여섯 시 사십 분, 청와대가 긴급 국가안전보장회의를 소집했다']];
  hideTitle();
  const pr = $('#prologue'), box = $('#plines');
  box.innerHTML = lines.map(([d, l], i) => `<p class="${i === lines.length - 1 ? 'last' : ''}"><time>${d}</time><span>${l}</span></p>`).join('');
  pr.hidden = false;
  const ps = [...box.children], timers = [];
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  ps.forEach((p, i) => timers.push(setTimeout(() => p.classList.add('on'), reduce ? 0 : 400 + i * 1300)));
  const finish = () => { timers.forEach(clearTimeout); proDone = null; pr.hidden = true; startGame(true); };
  timers.push(setTimeout(finish, reduce ? 4000 : 400 + lines.length * 1300 + 2200));
  proDone = finish;
}
// 배경: 상황실 지도 한 장. 움직이지 않는다
let tOff = null;
function drawTitleMap(cv) {
  const W = cv.width, H = cv.height, dpr = Math.min(2, window.devicePixelRatio || 1);
  const c = cv.getContext('2d');
  const fc = topojson.feature(TOPO, TOPO.objects.p);
  const pj = W > H ? d3.geoMercator().center([122, 37.5]).scale(Math.max(W, H) * 1.5).translate([W * 0.7, H * 0.47]) : d3.geoMercator().center([127.3, 38]).scale(Math.min(H * 0.95, W * 2.1)).translate([W * 0.6, H * 0.21]);
  const pa = d3.geoPath(pj, c);
  const kor = f => ORIG[f.id] === 'KOR' || ORIG[f.id] === 'PRK';
  c.fillStyle = '#0b0d10'; c.fillRect(0, 0, W, H);
  c.strokeStyle = 'rgba(255,255,255,0.035)'; c.lineWidth = dpr; c.beginPath(); pa(d3.geoGraticule().step([5, 5])()); c.stroke();
  for (const f of fc.features) { c.beginPath(); pa(f); c.fillStyle = ORIG[f.id] === 'KOR' ? '#9c3127' : ORIG[f.id] === 'PRK' ? '#6a2a24' : '#171b20'; c.fill(); }
  c.beginPath(); pa(topojson.mesh(TOPO, TOPO.objects.p, (a, b) => a !== b && ORIG[a.id] !== ORIG[b.id] && !(kor(a) && kor(b)))); c.strokeStyle = 'rgba(200,195,185,0.22)'; c.lineWidth = dpr; c.stroke();
  c.beginPath(); pa(topojson.mesh(TOPO, TOPO.objects.p, (a, b) => a !== b && kor(a) && kor(b) && ORIG[a.id] !== ORIG[b.id])); c.strokeStyle = 'rgba(255,255,255,0.75)'; c.lineWidth = 1.5 * dpr; c.setLineDash([5 * dpr, 4 * dpr]); c.stroke(); c.setLineDash([]);
  const cities = [['서울', 126.98, 37.57], ['평양', 125.75, 39.03], ['베이징', 116.4, 39.9], ['도쿄', 139.69, 35.69], ['상하이', 121.47, 31.23], ['블라디보스토크', 131.9, 43.12], ['타이베이', 121.56, 25.04]];
  c.font = `${12 * dpr}px "IBM Plex Sans KR", sans-serif`; c.textBaseline = 'middle';
  for (const [n, lo, la] of cities) {
    const [x, y] = pj([lo, la]); if (x < 0 || y < 0 || x > W || y > H) continue;
    c.fillStyle = n === '서울' ? '#ffffff' : 'rgba(220,215,205,0.7)';
    c.fillRect(x - 2.5 * dpr, y - 2.5 * dpr, 5 * dpr, 5 * dpr);
    c.fillText(n, x + 7 * dpr, y);
  }
}
function startTitleAnim() {
  const cv = $('#tbg'); const dpr = Math.min(2, window.devicePixelRatio || 1);
  const draw = () => {
    const W = Math.round(cv.clientWidth * dpr), H = Math.round(cv.clientHeight * dpr);
    if (!W || !H) return;
    if (cv.width === W && cv.height === H && tOff) return;
    cv.width = W; cv.height = H; tOff = true; drawTitleMap(cv);
  };
  tOff = null; draw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { tOff = null; if (!$('#title').hidden) draw(); });
  window.onresize = () => { if (!$('#title').hidden) draw(); };
}
